<!DOCTYPE html>
<html lang="ro">
<head>

<style>
  :root {
    /* AMOLED palette: black background, golden accents */
    --teal-deep: #2a8a83;
    --teal: #3aaca4;
    --teal-light: #5ccac3;
    --lake: #7dd9d2;
    --amber: #d4a55a;
    --amber-light: #e8c084;
    /* Surface tones (cream variables remapped for dark theme):
       cream = card background, cream-warm = elevated card / hover */
    --cream: #0e0e0e;          /* Card surface */
    --cream-warm: #181818;     /* Elevated / hover surface */
    --paper: #000000;          /* True black for AMOLED */
    --surface: #0a0a0a;
    --surface-2: #141414;
    --ink: #f5efe2;            /* Off-white text */
    --ink-soft: #b8b0a0;       /* Secondary text */
    --muted: #6a655c;          /* Muted/disabled */
    --line: #2a2620;           /* Borders */
    --line-soft: #1a1814;      /* Subtle dividers */
    --done-bg: #0d1a18;
    --done-text: #5a6661;
    --danger: #d65a48;
    --me: #2a8a83;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(212, 165, 90, 0.025) 0%, transparent 50%),
      radial-gradient(circle at 85% 90%, rgba(42, 138, 131, 0.025) 0%, transparent 50%);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ============ HEADER ============ */
  header.app-header {
    background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
    color: var(--ink);
    padding: calc(env(safe-area-inset-top) + 0.6rem) 1rem 0.65rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 1px 0 rgba(13, 79, 74, 0.03);
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .wordmark {
    flex: 1;
    min-width: 0;
    line-height: 1;
  }

  .wordmark-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .wordmark-brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.22em;
    color: var(--teal-deep);
    line-height: 1;
  }

  /* Λ instead of A for brand consistency with merakiestate.ro */
  .wordmark-brand .lambda {
    font-family: 'Cormorant Garamond', serif;
    font-style: normal;
    font-weight: 500;
    color: var(--amber);
  }

  .wordmark-divider {
    color: var(--line);
    font-weight: 300;
    font-size: 0.9rem;
  }

  .wordmark-project {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wordmark-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.4rem;
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .wordmark-meta .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }

  .progress-mini {
    flex: 1;
    height: 3px;
    background: var(--line-soft);
    border-radius: 100px;
    overflow: hidden;
    min-width: 30px;
    max-width: 80px;
  }

  .progress-mini-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--teal) 0%, var(--amber) 100%);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 100px;
  }

  .progress-percent {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--teal-deep);
    letter-spacing: 0;
  }

  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.15rem 0.55rem 0.15rem 0.45rem;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-left: auto;
    max-width: 110px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .sync-badge:active { transform: scale(0.96); }

  .sync-badge .sync-dot {
    font-size: 0.65rem;
    line-height: 1;
  }

  .sync-badge.ok .sync-dot { color: #2a8a83; }
  .sync-badge.pending .sync-dot { color: var(--amber); }
  .sync-badge.syncing .sync-dot {
    color: var(--teal);
    animation: spin 1s linear infinite;
    display: inline-block;
  }
  .sync-badge.offline {
    border-color: var(--danger);
    color: var(--danger);
  }
  .sync-badge.offline .sync-dot { color: var(--danger); }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .header-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
    padding: 0;
  }

  .icon-btn:active {
    background: var(--cream-warm);
    transform: scale(0.95);
  }

  /* legacy progress styles (no longer used in compact header) */

  /* ============ FILTER PILLS ============ */
  .filter-bar {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.75rem 1rem 0.5rem;
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .pill {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.4rem 0.85rem;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 0.73rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .pill.active {
    background: var(--teal-deep);
    color: var(--ink);
    border-color: var(--teal-deep);
  }

  .pill:active { transform: scale(0.96); }

  /* ============ MAIN ============ */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.5rem 1.25rem 4rem;
  }

  /* ============ BLOCK SECTIONS ============ */
  .block-section {
    background: var(--cream);
    border-radius: 14px;
    margin-bottom: 1.25rem;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line-soft);
  }

  .block-header {
    padding: 1rem 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    background: linear-gradient(180deg, var(--cream-warm) 0%, var(--cream) 100%);
    border-bottom: 1px solid var(--line-soft);
    user-select: none;
  }

  .block-header.collapsed { border-bottom: 1px solid transparent; }

  .block-icon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--teal-deep);
    background: var(--paper);
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--line-soft);
  }

  .block-info { flex: 1; min-width: 0; }

  .block-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--teal-deep);
    letter-spacing: 0.01em;
    line-height: 1.1;
  }

  .block-meta {
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    font-weight: 500;
  }

  .block-progress-wrap { display: flex; align-items: center; gap: 0.5rem; }

  .block-progress {
    width: 50px;
    height: 50px;
    position: relative;
    flex-shrink: 0;
  }

  .block-progress svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .block-progress circle {
    fill: none;
    stroke-width: 4;
  }

  .block-progress .bg-circle { stroke: var(--line-soft); }
  .block-progress .fg-circle {
    stroke: var(--amber);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s;
  }

  .block-progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--teal-deep);
  }

  .chevron {
    color: var(--ink-soft);
    transition: transform 0.3s;
    font-size: 0.85rem;
  }

  .block-header.collapsed .chevron { transform: rotate(-90deg); }

  .block-body {
    padding: 0.5rem 0;
    max-height: 30000px;
    transition: max-height 0.4s ease, padding 0.3s;
    overflow: hidden;
  }

  .block-body.collapsed { max-height: 0; padding: 0; }

  /* ============ ZONES ============ */
  .zone {
    padding: 0.75rem 1.1rem;
    border-top: 1px solid var(--line-soft);
  }
  .zone:first-child { border-top: none; }

  .zone-title {
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
    margin: 0 0 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .zone-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line) 0%, transparent 100%);
  }

  .zone-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }

  /* ============ TASKS ============ */

  /* Custom (user-added) tasks */
  .zone-custom {
    border-top: 1px dashed var(--line);
  }
  .zone-custom .zone-title {
    color: var(--amber-light);
  }
  .task-custom .task-text {
    font-style: italic;
  }
  .task-tag.custom-tag {
    background: var(--surface-2);
    color: var(--amber-light);
    border: 1px solid var(--line);
    font-style: normal;
  }
  .task-actions {
    display: flex;
    align-items: flex-start;
    gap: 0.15rem;
  }
  .task-delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0.25rem 0.4rem;
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.15s;
    align-self: flex-start;
    margin-top: 1px;
  }
  .task-delete-btn:active {
    color: var(--danger);
    opacity: 1;
  }
  .add-task-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--amber);
    padding: 0.6rem 1rem;
    margin-top: 0.5rem;
    border-radius: 8px;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .add-task-btn:active {
    background: var(--cream-warm);
    transform: scale(0.99);
  }
  .add-task-icon {
    font-size: 1rem;
    line-height: 1;
    color: var(--amber);
  }
  .task-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.65rem 0.25rem;
    border-radius: 6px;
    transition: background 0.15s;
    position: relative;
    border-bottom: 1px solid rgba(217, 208, 189, 0.3);
  }

  .task:last-child { border-bottom: none; }
  .task:active { background: var(--paper); }

  .task-checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--lake);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    transition: all 0.2s;
    cursor: pointer;
  }

  .task.done .task-checkbox {
    background: var(--teal);
    border-color: var(--teal);
  }

  .task-checkbox::after {
    content: '';
    width: 6px;
    height: 11px;
    border: solid var(--cream);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .task.done .task-checkbox::after { transform: rotate(45deg) scale(1); }

  .task-content { flex: 1; min-width: 0; cursor: pointer; }

  .task-text {
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--ink);
    word-wrap: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    text-decoration-color: var(--muted);
    color: var(--done-text);
  }

  .task-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    text-transform: uppercase;
    margin-left: 0.4rem;
    vertical-align: 2px;
    background: var(--danger);
    color: var(--ink);
  }

  /* Assignment chip */
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.35rem;
    align-items: center;
  }

  .assign-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.25rem 0.6rem 0.25rem 0.5rem;
    border-radius: 100px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .assign-chip:active { transform: scale(0.97); }

  .assign-chip .chip-icon {
    font-size: 0.85rem;
    line-height: 1;
  }

  .assign-chip.unassigned {
    background: transparent;
    border-style: dashed;
    color: var(--muted);
  }

  .assign-chip.assigned-me {
    background: var(--me);
    color: var(--ink);
    border-color: var(--me);
  }

  .assign-chip.assigned-contact {
    background: var(--teal-light);
    color: var(--ink);
    border-color: var(--teal-light);
  }

  .call-btn {
    background: var(--amber);
    color: var(--ink);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
  }

  .call-btn:active { transform: scale(0.92); }

  .task-note-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    padding: 0.25rem 0.4rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    align-self: flex-start;
    margin-top: 1px;
  }

  .task-note-btn.has-note {
    opacity: 1;
    color: var(--amber);
  }

  .task-note {
    background: var(--paper);
    border-left: 3px solid var(--amber);
    padding: 0.6rem 0.8rem;
    margin: 0.4rem 0 0.2rem 0;
    border-radius: 0 6px 6px 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    display: none;
  }

  .task-note.visible { display: block; }

  .task-note textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-family: inherit;
    font-style: inherit;
    color: inherit;
    font-size: inherit;
    resize: vertical;
    min-height: 40px;
    outline: none;
  }

  /* ============ CONTACTS SECTION ============ */
  .contacts-card {
    background: linear-gradient(135deg, #0a1e1c 0%, #0e2a27 100%);
    color: var(--ink);
    border-radius: 14px;
    padding: 1.1rem 0 0;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    border: 1px solid #1a3a36;
  }

  .contacts-header {
    padding: 0 1.1rem 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .contacts-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--amber-light);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .contacts-count {
    font-size: 0.7rem;
    color: rgba(245, 239, 226, 0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.15rem;
  }

  .contacts-list {
    max-height: 5000px;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  .contacts-list.collapsed { max-height: 0; }

  .contact-category {
    padding: 0.6rem 1.1rem 0.3rem;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(224, 176, 106, 0.7);
    font-weight: 600;
    background: rgba(0, 0, 0, 0.15);
  }

  .contact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.65rem 1.1rem;
    border-top: 1px solid rgba(245, 239, 226, 0.06);
    border-left: 3px solid var(--amber);
  }

  .contact-info {
    flex: 1;
    min-width: 0;
  }

  .contact-name {
    font-weight: 500;
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.2;
  }

  .contact-phone {
    color: var(--amber-light);
    font-size: 0.78rem;
    text-decoration: none;
    letter-spacing: 0.03em;
    margin-top: 0.15rem;
    display: block;
  }

  .contact-actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .contact-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
  }

  .contact-btn.call { background: var(--amber); }
  .contact-btn.sms {
    background: rgba(245, 239, 226, 0.15);
    border: 1px solid rgba(245, 239, 226, 0.2);
  }

  /* ============ ASSIGN MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 1000;

  filter: 'all'
};

// Merged list of all contacts (seed + custom)
function getAllContacts() {
  return [...SEED_CONTACTS, ...state.customContacts];
}

// Get list of all categories (used in pickers)
function getAllCategories() {
  const fromSeed = [...new Set(SEED_CONTACTS.filter(c => !c.special).map(c => c.category))];
  const fromCustom = [...new Set(state.customContacts.map(c => c.category))];
  const fromExtra = state.customCategories || [];
  return [...new Set([...fromSeed, ...fromCustom, ...fromExtra])];
}

function generateContactId(name) {
  const base = name.toLowerCase()
    .replace(/[ăâ]/g, 'a').replace(/[î]/g, 'i').replace(/[șş]/g, 's').replace(/[țţ]/g, 't')
    .replace(/[^a-z0-9]/g, '-')
    .replace(/-+/g, '-').replace(/^-|-$/g, '');
  let id = 'custom-' + (base || 'contact');
  let n = 1;
  const existing = new Set(getAllContacts().map(c => c.id));
  let candidate = id;
  while (existing.has(candidate)) {
    n++;
    candidate = `${id}-${n}`;
  }
  return candidate;
}

// ============ FIREBASE SYNC ============
// Realtime sync via Firebase Realtime Database.
// Set in <head> via firebaseApp/firebaseDb (assigned by the module script).

const sync = {
  online: false,
  initialized: false,
  syncing: false,
  actor: null,
  pendingWrites: 0,
  applyingRemote: false  // true while applying server snapshot, suppresses local→server echo
};

function getActorName() {
  let name = localStorage.getItem('merakiActor');
  if (!name) {
    name = prompt('Cum vrei să apari pentru ceilalți? (ex: Meraki, unchiul)') || 'anonim';
    name = name.trim().slice(0, 40) || 'anonim';
    localStorage.setItem('merakiActor', name);
  }
  return name;
}

function setActorName(name) {
  const clean = (name || '').trim().slice(0, 40);
  if (!clean) return;
  localStorage.setItem('merakiActor', clean);
  sync.actor = clean;
  updateSyncBadge();
}

function updateSyncBadge() {
  const badge = document.getElementById('syncBadge');
  if (!badge) return;
  let cls = 'ok', label = '●';
  if (sync.syncing || sync.pendingWrites > 0) { cls = 'syncing'; label = '⟳'; }
  else if (!sync.online) { cls = 'offline'; label = '○'; }
  badge.className = 'sync-badge ' + cls;
  const actorEl = document.getElementById('syncActor');
  if (actorEl) actorEl.textContent = sync.actor || '...';
  const dotEl = badge.querySelector('.sync-dot');
  if (dotEl) dotEl.textContent = label;
}

// ===== Firebase wrappers =====
// We use the modular SDK (window.firebaseDb is a Database reference object,
// window.fb namespace holds ref/update/onValue/push/serverTimestamp)

function fbRef(path) {
  return window.fb.ref(window.firebaseDb, path);
}

async function fbUpdate(path, value) {
  // Record this write as "pending" so concurrent snapshot reconciliation doesn't undo it.
  recordPendingWrite(path, value);
  sync.pendingWrites++;
  updateSyncBadge();
  try {
    if (value === null) {
      await window.fb.remove(fbRef(path));
    } else {
      await window.fb.set(fbRef(path), value);
    }
    if (window.__debugFb) console.log('[FB write OK]', path, value);
  } catch (e) {
    console.error('[FB write FAIL]', path, e.message, e.code || '', e);
    throw e;  // re-throw so callers can see it
  } finally {
    sync.pendingWrites--;
    updateSyncBadge();
  }
}

async function fbMultiUpdate(updates) {
  // updates: { '/done/x': true, '/notes/y': 'text' }
  Object.keys(updates).forEach(path => {
    // Strip leading slash for our internal pending tracking (consistent with fbUpdate)
    const cleanPath = path.startsWith('/') ? path.slice(1) : path;
    recordPendingWrite(cleanPath, updates[path]);
  });
  sync.pendingWrites++;
  updateSyncBadge();
  try {
    await window.fb.update(fbRef('/'), updates);
  } catch (e) {
    console.warn('FB multi-update failed:', e.message);
  } finally {
    sync.pendingWrites--;
    updateSyncBadge();
  }
}

async function fbPushAudit(entry) {
  try {
    const auditRef = fbRef('audit');
    await window.fb.push(auditRef, entry);
  } catch (e) {
    console.warn('FB audit push failed:', e.message);
  }
}

// ===== Op → Firebase writes (replaces queueOp pattern) =====

async function applyAndSync_toggleDone(taskId, value) {
  if (value) {
    state.done[taskId] = true;
  } else {
    delete state.done[taskId];
  }
  await fbUpdate(`done/${taskId}`, value ? true : null);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: value ? 'bifat' : 'debifat', taskId });
}

async function applyAndSync_setNote(taskId, value) {
  if (value) {
    state.notes[taskId] = value;
  } else {
    delete state.notes[taskId];
  }
  await fbUpdate(`notes/${taskId}`, value ? value : null);
  if (value) fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'notă', taskId });
}

async function applyAndSync_setAssign(taskId, contactId) {
  if (contactId === null || contactId === undefined) {
    delete state.assignments[taskId];
    await fbUpdate(`assignments/${taskId}`, null);
    fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'eliminat asignare', taskId });
  } else {
    state.assignments[taskId] = contactId;
    await fbUpdate(`assignments/${taskId}`, contactId);
    fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'asignat', taskId, contactId });
  }
}

async function applyAndSync_addContact(contact) {
  // Idempotent on id
  if (state.customContacts.find(c => c.id === contact.id)) return;
  state.customContacts.push(contact);
  await fbUpdate(`customContacts/${contact.id}`, contact);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'contact adăugat', name: contact.name });
}

async function applyAndSync_updateContact(contact) {
  const existing = state.customContacts.find(c => c.id === contact.id);
  if (!existing) return;
  Object.assign(existing, contact);
  await fbUpdate(`customContacts/${contact.id}`, existing);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'contact editat', name: existing.name });
}

async function applyAndSync_deleteContact(contactId) {
  const c = state.customContacts.find(cc => cc.id === contactId);
  if (!c) return;
  const name = c.name;
  // Clear assignments referencing this contact
  const updates = {};
  Object.keys(state.assignments).forEach(taskId => {
    if (state.assignments[taskId] === contactId) {
      delete state.assignments[taskId];
      updates[`assignments/${taskId}`] = null;
    }
  });
  updates[`customContacts/${contactId}`] = null;
  state.customContacts = state.customContacts.filter(cc => cc.id !== contactId);
  await fbMultiUpdate(updates);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'contact șters', name });
}

async function applyAndSync_addCategory(name) {
  if (!state.customCategories.includes(name)) {
    state.customCategories.push(name);
    await fbUpdate(`customCategories/${state.customCategories.length - 1}`, name);
  }
}

async function applyAndSync_addCustomTask(blockId, text, zoneTitle) {
  text = (text || '').trim();
  if (!text) return null;
  const taskId = `custom-${blockId}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
  const task = {
    id: taskId,
    text: text,
    zone: zoneTitle || null,  // optional: which zone to attach to
    createdBy: sync.actor || 'anonim',
    createdAt: Date.now()
  };
  if (!state.customTasks[blockId]) state.customTasks[blockId] = [];
  state.customTasks[blockId].push(task);
  await fbUpdate(`customTasks/${blockId}/${taskId}`, task);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'task adăugat', text, blockId, zone: zoneTitle || null });
  return task;
}

async function applyAndSync_deleteCustomTask(blockId, taskId) {
  if (!state.customTasks[blockId]) return;
  const task = state.customTasks[blockId].find(t => t.id === taskId);
  if (!task) return;
  const text = task.text;
  state.customTasks[blockId] = state.customTasks[blockId].filter(t => t.id !== taskId);
  // Curățăm și state-ul derivat al taskului
  const updates = {};
  updates[`customTasks/${blockId}/${taskId}`] = null;
  if (state.done[taskId]) { delete state.done[taskId]; updates[`done/${taskId}`] = null; }
  if (state.notes[taskId]) { delete state.notes[taskId]; updates[`notes/${taskId}`] = null; }
  if (state.assignments[taskId]) { delete state.assignments[taskId]; updates[`assignments/${taskId}`] = null; }
  await fbMultiUpdate(updates);
  fbPushAudit({ ts: Date.now(), actor: sync.actor, action: 'task șters', text });
}

// ===== Remote → local (Firebase listener) =====
//
// Issue: Firebase trimite snapshots aproape instant când scriem ceva local.
// Dacă avem 2 scrieri în zbor (ex: add contact + setAssign la el), un snapshot poate sosi
// după prima scriere dar înainte de a doua, ștergând starea pe care tocmai am aplicat-o local.
//
// Soluția: păstrăm un buffer de "scrieri locale recente" (path -> value).
// La aplicarea unui snapshot remote, suprapunem aceste valori peste val-ul de pe server
// înainte de a-l aplica în state. Curățăm buffer-ul când scrierile sunt confirmate prin
// faptul că snapshot-ul conține aceleași valori sau când expiră (~3s).
const pendingLocal = {
  // path -> { value, ts }
  writes: new Map()
};

function recordPendingWrite(path, value) {
  pendingLocal.writes.set(path, { value, ts: Date.now() });
  // Auto-expire after 30s (was 5s; some writes can take longer on slow mobile networks)
  setTimeout(() => {
    const existing = pendingLocal.writes.get(path);
    if (existing && Date.now() - existing.ts >= 30000) {
      pendingLocal.writes.delete(path);
    }
  }, 30500);
}

function applyPendingWritesOnto(val) {
  // Apply each pending write to the snapshot val, overlaying any stale data.
  pendingLocal.writes.forEach((entry, path) => {
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let cursor = val;
    for (let i = 0; i < parts.length - 1; i++) {
      const k = parts[i];
      if (!cursor[k] || typeof cursor[k] !== 'object') cursor[k] = {};
      cursor = cursor[k];
    }
    const lastKey = parts[parts.length - 1];
    if (entry.value === null || entry.value === undefined) {
      delete cursor[lastKey];
    } else {
      cursor[lastKey] = entry.value;
    }
  });
  return val;
}

function clearPendingWriteIfMatches(path, expectedValue, val) {
  // Walk val using path; if value matches expected, drop from pending.
  const parts = path.split('/').filter(Boolean);
  let cursor = val;
  for (const k of parts) {
    if (cursor === null || cursor === undefined || typeof cursor !== 'object') {
      cursor = undefined;
      break;
    }
    cursor = cursor[k];
  }
  // Match check: for objects, do shallow compare; for primitives, ===
  const matches = (expectedValue === null && (cursor === null || cursor === undefined))
    || (expectedValue === cursor)
    || (typeof expectedValue === 'object' && expectedValue !== null && cursor && JSON.stringify(expectedValue) === JSON.stringify(cursor));
  if (matches) pendingLocal.writes.delete(path);
}

function applyRemoteSnapshot(snapshot) {
  sync.applyingRemote = true;
  try {
    let val = snapshot.val() || {};
    // Check if any pending writes are already reflected; if so, drop them.
    pendingLocal.writes.forEach((entry, path) => {
      clearPendingWriteIfMatches(path, entry.value, val);
    });
    // Overlay still-pending writes
    val = applyPendingWritesOnto(val);

    state.done = val.done || {};
    state.notes = val.notes || {};
    state.assignments = val.assignments || {};

    // customContacts: merge — server provides authoritative, but keep local-only items
    // that might still be in pending state.
    const serverContacts = (val.customContacts && typeof val.customContacts === 'object')
      ? Object.values(val.customContacts).filter(c => c && c.id) : [];
    const serverContactIds = new Set(serverContacts.map(c => c.id));
    // Local-only contacts (not yet on server) — keep them if they have pending writes
    const localOnlyContacts = state.customContacts.filter(c =>
      c && c.id && !serverContactIds.has(c.id) && pendingLocal.writes.has(`customContacts/${c.id}`)
    );
    state.customContacts = [...serverContacts, ...localOnlyContacts];

    // customCategories
    if (Array.isArray(val.customCategories)) {
      state.customCategories = val.customCategories.filter(x => x);
    } else if (val.customCategories && typeof val.customCategories === 'object') {
      state.customCategories = Object.values(val.customCategories).filter(x => x);
    } else {
      state.customCategories = [];
    }

    // customTasks: { blockId: { taskId: task, ... } } -> { blockId: [tasks] }
    // Same merge logic: keep local-only tasks still pending
    const serverCustomTasks = {};
    if (val.customTasks && typeof val.customTasks === 'object') {
      Object.keys(val.customTasks).forEach(blockId => {
        const blockTasks = val.customTasks[blockId];
        if (blockTasks && typeof blockTasks === 'object') {
          serverCustomTasks[blockId] = Object.values(blockTasks)
            .filter(t => t && t.id && t.text)
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }
      });
    }
    // Merge: keep any local task that's still pending
    Object.keys(state.customTasks).forEach(blockId => {
      const localTasks = state.customTasks[blockId] || [];
      const serverIds = new Set((serverCustomTasks[blockId] || []).map(t => t.id));
      const localOnly = localTasks.filter(t =>
        t && t.id && !serverIds.has(t.id) && pendingLocal.writes.has(`customTasks/${blockId}/${t.id}`)
      );
      if (localOnly.length > 0) {
        serverCustomTasks[blockId] = [...(serverCustomTasks[blockId] || []), ...localOnly];
      }
    });
    state.customTasks = serverCustomTasks;

    // Apply default assignments where none set
    DATA.forEach(block => {
      if (block.zones) {
        block.zones.forEach(zone => {
          zone.tasks.forEach(task => {
            if (task.defaultAssign && !(task.id in state.assignments)) {
              state.assignments[task.id] = task.defaultAssign;
            }
          });
        });
      }
    });

    saveState();
    render();
  } finally {
    sync.applyingRemote = false;
  }
}

function startFirebaseSync() {
  if (!window.firebaseDb) {
    console.error('Firebase not initialized');
    sync.online = false;
    updateSyncBadge();
    return;
  }

  // Listen to connection state
  const connectedRef = window.fb.ref(window.firebaseDb, '.info/connected');
  window.fb.onValue(connectedRef, (snap) => {
    sync.online = !!snap.val();
    updateSyncBadge();
  });

  // Listen to entire state (this is small — bifs/notes/assignments)
  // Each device receives instant updates when others write.
  const stateRef = fbRef('/');
  window.fb.onValue(stateRef, (snap) => {
    applyRemoteSnapshot(snap);
    sync.initialized = true;
  }, (err) => {
    console.error('FB listener error:', err);
    sync.online = false;
    updateSyncBadge();
  });
}

// ============ STATE LOADING (fallback offline) ============
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (!Array.isArray(state.customContacts)) state.customContacts = [];
      if (!Array.isArray(state.customCategories)) state.customCategories = [];
    }
  } catch (e) { console.warn('Load fail', e); }

  // Apply default assignments where none set
  DATA.forEach(block => {
    if (block.zones) {
      block.zones.forEach(zone => {
        zone.tasks.forEach(task => {
          if (task.defaultAssign && !(task.id in state.assignments)) {
            state.assignments[task.id] = task.defaultAssign;
          }
        });
      });
    }
  });
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('Save fail', e); }
}

// ============ HELPERS ============
function getContact(id) {
  return getAllContacts().find(c => c.id === id);
}

function findTask(id) {
  for (const block of DATA) {
    if (!block.zones) continue;
    for (const zone of block.zones) {
      const t = zone.tasks.find(t => t.id === id);
      if (t) return t;
    }
  }
  // Search in customTasks too
  for (const blockId in state.customTasks) {
    const t = (state.customTasks[blockId] || []).find(t => t.id === id);
    if (t) return t;
  }
  return null;
}

function findBlockForTask(id) {
  for (const block of DATA) {
    if (!block.zones) continue;
    for (const zone of block.zones) {
      if (zone.tasks.find(t => t.id === id)) return block.id;
    }
  }
  for (const blockId in state.customTasks) {
    if ((state.customTasks[blockId] || []).find(t => t.id === id)) return blockId;
  }
  return null;
}

function getBlockStats(block) {
  let total = 0, done = 0;
  if (block.zones) {
    block.zones.forEach(zone => {
      zone.tasks.forEach(task => {
        total++;
        if (state.done[task.id]) done++;
      });
    });
  }
  // Include custom tasks
  (state.customTasks[block.id] || []).forEach(task => {
    total++;
    if (state.done[task.id]) done++;
  });
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function getGlobalStats() {
  let total = 0, done = 0;
  DATA.forEach(block => {
    if (!block.zones) return;
    const s = getBlockStats(block);
    total += s.total;
    done += s.done;
  });
  // Include "other" virtual block
  if (state.customTasks['other']) {
    state.customTasks['other'].forEach(task => {
      total++;
      if (state.done[task.id]) done++;
    });
  }
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function getMyTaskCount() {
  let count = 0;
  Object.keys(state.assignments).forEach(taskId => {
    if (state.assignments[taskId] === 'me' && !state.done[taskId]) count++;
  });
  return count;
}

// ============ RENDER ============
function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  DATA.forEach(block => {
    if (block.isContacts) {
      main.appendChild(renderContacts(block));
    } else {
      main.appendChild(renderBlock(block));
    }
  });

  // Virtual block "Altele" — appears only if there are custom tasks under blockId 'other'
  if (state.customTasks['other'] && state.customTasks['other'].length > 0) {
    const otherBlock = {
      id: 'other',
      icon: '···',
      title: 'Altele',
      meta: 'Lucruri neîncadrate',
      zones: []
    };
    // Insert before the Contacts card if it exists, otherwise at the end
    const contactsEl = main.querySelector('.contacts-card');
    const otherEl = renderBlock(otherBlock);
    if (contactsEl) {
      main.insertBefore(otherEl, contactsEl);
    } else {
      main.appendChild(otherEl);
    }
  }

  updateGlobalProgress();
  updateMyTasksFab();
  applyFilter();
}

function renderBlock(block) {
  const blockEl = document.createElement('section');
  blockEl.className = 'block-section';
  blockEl.dataset.blockId = block.id;

  const stats = getBlockStats(block);
  const isCollapsed = state.collapsed[block.id];
  const allCustomTasks = state.customTasks[block.id] || [];

  // Distribute custom tasks: those with `zone` set go to that zone, others go to the "Adăugate manual" section.
  const tasksByZone = {};
  const unzonedTasks = [];
  allCustomTasks.forEach(t => {
    if (t.zone) {
      if (!tasksByZone[t.zone]) tasksByZone[t.zone] = [];
      tasksByZone[t.zone].push(t);
    } else {
      unzonedTasks.push(t);
    }
  });

  // Render the static zones, appending matching custom tasks at the end
  const zonesHtml = (block.zones || []).map(zone => {
    const extra = tasksByZone[zone.title] || [];
    return renderZone(zone, extra);
  }).join('');

  // The "Adăugate manual" catch-all zone (always present, contains unzoned customs)
  const customZoneHtml = `
    <div class="zone zone-custom" data-custom-zone-block="${block.id}">
      <h3 class="zone-title">
        <span>Adăugate manual${unzonedTasks.length ? ` <span class="zone-sub">${unzonedTasks.length} ${unzonedTasks.length === 1 ? 'task' : 'taskuri'}</span>` : ''}</span>
      </h3>
      <ul class="task-list">
        ${unzonedTasks.map(task => renderTask(task, true)).join('')}
      </ul>
      <button class="add-task-btn" data-add-task-block="${block.id}">
        <span class="add-task-icon">+</span> Adaugă task aici
      </button>
    </div>
  `;

  blockEl.innerHTML = `
    <div class="block-header ${isCollapsed ? 'collapsed' : ''}" data-block-toggle="${block.id}">
      <div class="block-icon">${block.icon}</div>
      <div class="block-info">
        <div class="block-title">${block.title}</div>
        <div class="block-meta">${block.meta} · ${stats.done}/${stats.total}</div>
      </div>
      <div class="block-progress-wrap">
        <div class="block-progress">
          <svg viewBox="0 0 50 50">
            <circle class="bg-circle" cx="25" cy="25" r="20"></circle>
            <circle class="fg-circle" cx="25" cy="25" r="20"
              stroke-dasharray="125.6"
              stroke-dashoffset="${125.6 * (1 - stats.percent / 100)}"></circle>
          </svg>
          <div class="block-progress-text">${stats.percent}%</div>
        </div>
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="block-body ${isCollapsed ? 'collapsed' : ''}">
      ${zonesHtml}
      ${customZoneHtml}
    </div>
  `;

  return blockEl;
}

function renderZone(zone, extraCustomTasks) {
  const customTasks = extraCustomTasks || [];
  return `
    <div class="zone">
      <h3 class="zone-title">
        <span>${zone.title}${zone.sub ? ` <span class="zone-sub">${zone.sub}</span>` : ''}</span>
      </h3>
      <ul class="task-list">
        ${zone.tasks.map(task => renderTask(task)).join('')}
        ${customTasks.map(task => renderTask(task, true)).join('')}
      </ul>
    </div>
  `;
}

function renderTask(task, isCustom) {
  const done = state.done[task.id];
  const note = state.notes[task.id] || '';
  const hasNote = note.length > 0;
  const urgentTag = task.urgent ? `<span class="task-tag">Urgent</span>` : '';
  const customBadge = isCustom && task.createdBy ? `<span class="task-tag custom-tag" title="Adăugat de ${task.createdBy}">+${task.createdBy}</span>` : '';

  const assignedId = state.assignments[task.id];
  const assignedContact = assignedId ? getContact(assignedId) : null;

  let chipHtml = '';
  let callBtn = '';

  if (!assignedContact) {
    chipHtml = `<span class="assign-chip unassigned" data-assign-task="${task.id}">
      <span class="chip-icon">+</span> Asignează
    </span>`;
  } else if (assignedContact.special === 'me') {
    chipHtml = `<span class="assign-chip assigned-me" data-assign-task="${task.id}">
      <span class="chip-icon">●</span> ${assignedContact.name}
    </span>`;
  } else {
    const roleSuffix = assignedContact.role ? ` · ${assignedContact.role}` : '';
    chipHtml = `<span class="assign-chip assigned-contact" data-assign-task="${task.id}">
      <span class="chip-icon">●</span> ${assignedContact.name}${roleSuffix}
    </span>`;
    if (assignedContact.phone) {
      callBtn = `<a href="tel:${assignedContact.phone}" class="call-btn" title="Sună ${assignedContact.name}" onclick="event.stopPropagation()">☎</a>`;
    }
  }

  const deleteBtn = isCustom
    ? `<button class="task-delete-btn" data-delete-task="${task.id}" title="Șterge task">✕</button>`
    : '';

  return `
    <li class="task ${done ? 'done' : ''}${isCustom ? ' task-custom' : ''}" data-task-id="${task.id}">
      <div class="task-checkbox" data-toggle-task="${task.id}"></div>
      <div class="task-content">
        <div class="task-text" data-toggle-task="${task.id}">${task.text}${urgentTag}${customBadge}</div>
        <div class="task-meta">
          ${chipHtml}
          ${callBtn}
        </div>
        <div class="task-note ${hasNote ? 'visible' : ''}" data-note-for="${task.id}">
          <textarea placeholder="Notă..." data-note-input="${task.id}">${note}</textarea>
        </div>
      </div>
      <div class="task-actions">
        <button class="task-note-btn ${hasNote ? 'has-note' : ''}" data-note-btn="${task.id}" title="Notă">✎</button>
        ${deleteBtn}
      </div>
    </li>
  `;
}

function renderContacts(block) {
  const sectionEl = document.createElement('section');
  sectionEl.className = 'contacts-card';

  const allContacts = getAllContacts();
  const grouped = {};
  allContacts.forEach(c => {
    if (c.special === 'me') return;
    if (!grouped[c.category]) grouped[c.category] = [];
    grouped[c.category].push(c);
  });

  const isCollapsed = state.collapsed['contacts'];
  const totalCount = allContacts.length - 1; // exclude "me"

  let html = `
    <div class="contacts-header" data-block-toggle="contacts">
      <div>
        <div class="contacts-title">Contacte</div>
        <div class="contacts-count">${totalCount} colaboratori</div>
      </div>
      <span class="chevron" style="color: var(--amber-light); ${isCollapsed ? 'transform: rotate(-90deg);' : ''}">▼</span>
    </div>
    <div class="contacts-list ${isCollapsed ? 'collapsed' : ''}">
      <div class="contact-add-btn-wrap">
        <button class="contact-add-btn" id="addContactBtn">+ Adaugă contact nou</button>
      </div>
  `;

  Object.keys(grouped).forEach(category => {
    html += `<div class="contact-category">${category}</div>`;
    grouped[category].forEach(c => {
      const displayName = c.role ? `${c.name} — ${c.role}` : c.name;
      const phoneHtml = c.phone ? `<a href="tel:${c.phone}" class="contact-phone">${c.phone}</a>` : `<span class="contact-phone" style="opacity:0.4">fără telefon</span>`;
      const isCustom = c.id.startsWith('custom-');
      const editBtn = isCustom ? `<button class="contact-btn edit" data-edit-contact="${c.id}" title="Editează">✎</button>` : '';
      const actions = `
        <div class="contact-actions">
          ${c.phone ? `<a href="tel:${c.phone}" class="contact-btn call" title="Sună">☎</a>` : ''}
          ${c.phone ? `<a href="sms:${c.phone}" class="contact-btn sms" title="SMS">✉</a>` : ''}
          ${editBtn}
        </div>
      `;
      html += `
        <div class="contact-row">
          <div class="contact-info">
            <div class="contact-name">${displayName}${isCustom ? ' <span class="custom-badge">custom</span>' : ''}</div>
            ${phoneHtml}
          </div>
          ${actions}
        </div>
      `;
    });
  });

  html += `</div>`;
  sectionEl.innerHTML = html;
  return sectionEl;
}

function updateGlobalProgress() {
  const s = getGlobalStats();
  document.getElementById('globalBar').style.width = s.percent + '%';
  document.getElementById('globalText').textContent = `${s.done}/${s.total}`;
  document.getElementById('globalPercent').textContent = s.percent + '%';
}

function updateBlockProgress(blockId) {
  const block = DATA.find(b => b.id === blockId);
  if (!block || !block.zones) return;
  const stats = getBlockStats(block);
  const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
  if (!blockEl) return;
  const fgCircle = blockEl.querySelector('.fg-circle');
  const text = blockEl.querySelector('.block-progress-text');
  const meta = blockEl.querySelector('.block-meta');
  if (fgCircle) fgCircle.setAttribute('stroke-dashoffset', 125.6 * (1 - stats.percent / 100));
  if (text) text.textContent = stats.percent + '%';
  if (meta) meta.textContent = `${block.meta} · ${stats.done}/${stats.total}`;
}

function updateMyTasksFab() {
  const count = getMyTaskCount();
  const fab = document.getElementById('myTasksFab');
  document.getElementById('fabCount').textContent = count;
  fab.style.display = count > 0 ? 'flex' : 'none';
}

function updateTaskAssignment(taskId) {
  // Re-render just that task's meta area
  const taskEl = document.querySelector(`[data-task-id="${taskId}"]`);
  if (!taskEl) return;
  const task = findTask(taskId);
  if (!task) return;

  const metaEl = taskEl.querySelector('.task-meta');
  if (!metaEl) return;

  const assignedId = state.assignments[taskId];
  const assignedContact = assignedId ? getContact(assignedId) : null;

  let chipHtml = '';
  let callBtn = '';

  if (!assignedContact) {
    chipHtml = `<span class="assign-chip unassigned" data-assign-task="${taskId}">
      <span class="chip-icon">+</span> Asignează
    </span>`;
  } else if (assignedContact.special === 'me') {
    chipHtml = `<span class="assign-chip assigned-me" data-assign-task="${taskId}">
      <span class="chip-icon">●</span> ${assignedContact.name}
    </span>`;
  } else {
    const roleSuffix = assignedContact.role ? ` · ${assignedContact.role}` : '';
    chipHtml = `<span class="assign-chip assigned-contact" data-assign-task="${taskId}">
      <span class="chip-icon">●</span> ${assignedContact.name}${roleSuffix}
    </span>`;
    if (assignedContact.phone) {
      callBtn = `<a href="tel:${assignedContact.phone}" class="call-btn" title="Sună" onclick="event.stopPropagation()">☎</a>`;
    }
  }

  metaEl.innerHTML = chipHtml + callBtn;
}

// ============ TASK PICKER (FAB workflow) ============
let activePicker = { stage: 'block', blockId: null, blockTitle: null };

function openTaskPicker() {
  activePicker = { stage: 'block', blockId: null, blockTitle: null };
  renderTaskPicker();
  document.getElementById('taskPickerModal').classList.add('visible');
}

function closeTaskPicker() {
  document.getElementById('taskPickerModal').classList.remove('visible');
  resetModalStyles('taskPickerModal');
  activePicker = { stage: 'block', blockId: null, blockTitle: null };
}

function renderTaskPicker() {
  const titleEl = document.getElementById('pickerTitle');
  const breadEl = document.getElementById('pickerBreadcrumb');
  const backBtn = document.getElementById('pickerBack');
  const listEl = document.getElementById('pickerList');

  if (activePicker.stage === 'block') {
    titleEl.textContent = 'Unde adăugăm taskul?';
    breadEl.style.display = 'none';
    backBtn.style.display = 'none';

    // Blocks from DATA + a virtual "Altele" option
    const blocks = DATA.filter(b => !b.isContacts);
    let html = '';
    blocks.forEach(block => {
      html += `
        <div class="picker-option" data-pick-block="${block.id}" data-pick-block-title="${block.title}">
          <div class="picker-option-icon">${block.icon}</div>
          <div class="picker-option-info">
            <div class="picker-option-name">${block.title}</div>
            <div class="picker-option-meta">${block.meta}</div>
          </div>
          <span class="picker-arrow">›</span>
        </div>
      `;
    });
    // "Altele" — un container catch-all care nu se leagă de niciun bloc real
    html += `
      <div class="picker-option" data-pick-block="other" data-pick-block-title="Altele">
        <div class="picker-option-icon">···</div>
        <div class="picker-option-info">
          <div class="picker-option-name">Altele</div>
          <div class="picker-option-meta">Lucruri neîncadrate</div>
        </div>
        <span class="picker-arrow">›</span>
      </div>
    `;
    listEl.innerHTML = html;
    return;
  }

  if (activePicker.stage === 'zone') {
    const block = DATA.find(b => b.id === activePicker.blockId);
    titleEl.textContent = 'În ce zonă?';
    breadEl.textContent = activePicker.blockTitle;
    breadEl.style.display = 'block';
    backBtn.style.display = 'flex';

    let html = '';
    // "General" — fără zonă specifică, merge în "Adăugate manual"
    html += `
      <div class="picker-option" data-pick-zone="__none__">
        <div class="picker-option-icon">+</div>
        <div class="picker-option-info">
          <div class="picker-option-name">Adăugate manual</div>
          <div class="picker-option-meta">Fără zonă specifică</div>
        </div>
      </div>
    `;
    if (block && block.zones) {
      block.zones.forEach(zone => {
        const subSuffix = zone.sub ? ` — ${zone.sub.replace(/&amp;/g, '&')}` : '';
        html += `
          <div class="picker-option" data-pick-zone="${zone.title.replace(/"/g, '&quot;')}">
            <div class="picker-option-icon">·</div>
            <div class="picker-option-info">
              <div class="picker-option-name">${zone.title}${subSuffix}</div>
              <div class="picker-option-meta">${zone.tasks.length} ${zone.tasks.length === 1 ? 'task' : 'taskuri'}</div>
            </div>
          </div>
        `;
      });
    }
    listEl.innerHTML = html;
    return;
  }
}

function handlePickerClick(e) {
  // Back button
  if (e.target.closest('#pickerBack')) {
    activePicker.stage = 'block';
    activePicker.blockId = null;
    activePicker.blockTitle = null;
    renderTaskPicker();
    return;
  }

  // Block selection
  const blockOpt = e.target.closest('[data-pick-block]');
  if (blockOpt && activePicker.stage === 'block') {
    const blockId = blockOpt.dataset.pickBlock;
    const blockTitle = blockOpt.dataset.pickBlockTitle;

    if (blockId === 'other') {
      // "Altele" — sărim direct la text input, fără zone picker
      closeTaskPicker();
      openTaskCreator('other', 'Altele', null);
      return;
    }

    activePicker.blockId = blockId;
    activePicker.blockTitle = blockTitle;
    activePicker.stage = 'zone';
    renderTaskPicker();
    return;
  }

  // Zone selection
  const zoneOpt = e.target.closest('[data-pick-zone]');
  if (zoneOpt && activePicker.stage === 'zone') {
    const zoneTitle = zoneOpt.dataset.pickZone === '__none__' ? null : zoneOpt.dataset.pickZone;
    const blockId = activePicker.blockId;
    const blockTitle = activePicker.blockTitle;
    closeTaskPicker();
    openTaskCreator(blockId, blockTitle, zoneTitle);
    return;
  }
}

async function saveNewTask() {

async function saveContactFromEditor() {
  const name = document.getElementById('contactName').value.trim();
  const role = document.getElementById('contactRole').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  let category = activeContactEditor.selectedCategory;
  let newCategoryAdded = null;

  // If "new category" was active, use the input
  const newCatInput = document.getElementById('contactNewCategory');
  if (newCatInput.style.display !== 'none') {
    const newCat = newCatInput.value.trim();
    if (newCat) {
      category = newCat;
      if (!state.customCategories.includes(newCat)) {
        state.customCategories.push(newCat);
        newCategoryAdded = newCat;
      }
    }
  }

  if (!name) {
    document.getElementById('contactName').focus();
    document.getElementById('contactName').style.borderColor = 'var(--danger)';
    return null;
  }

  if (!category) category = 'Subcontractori';

  if (newCategoryAdded) {
    applyAndSync_addCategory(newCategoryAdded);
  }

  if (activeContactEditor.contact) {
    // Edit existing
    const c = state.customContacts.find(cc => cc.id === activeContactEditor.contact.id);
    if (c) {
      c.name = name;
      c.role = role;
      c.phone = phone;
      c.category = category;
    }
    saveState();
    const cb = activeContactEditor.callback;
    await applyAndSync_updateContact({ id: c.id, name, role, phone, category });
    closeContactEditor();
    if (cb) cb(c);
    return c;
  } else {
    // Create new
    const newContact = {
      id: generateContactId(name),
      name: name,
      role: role,
      phone: phone,
      category: category
    };

    state.customContacts.push(newContact);
    saveState();
    const cb = activeContactEditor.callback;

    let writeError = null;
    try {
      await applyAndSync_addContact(newContact);
    } catch (e) {
      writeError = e;
      console.error('Contact write FAILED:', e);
      showToast('Eroare salvare contact — vezi consola (long-press pe wordmark)');
    }

    closeContactEditor();
    if (cb && !writeError) cb(newContact);
    return newContact;
  }
}

function deleteCurrentContact() {
  const c = activeContactEditor.contact;
  if (!c) return;
  // Remove assignments to this contact
  Object.keys(state.assignments).forEach(taskId => {
    if (state.assignments[taskId] === c.id) delete state.assignments[taskId];
  });
  state.customContacts = state.customContacts.filter(cc => cc.id !== c.id);
  saveState();
  applyAndSync_deleteContact(c.id);
  showToast(`Șters: ${c.name}`);
  closeContactEditor();
  // Re-render everything since assignments may have changed across many tasks
  render();
}

// ============ FILTER ============
function applyFilter() {
  const filter = state.filter;
  document.querySelectorAll('.task').forEach(taskEl => {
    const id = taskEl.dataset.taskId;
    const done = !!state.done[id];
    const assigned = state.assignments[id];
    let show = true;
    if (filter === 'open') show = !done;
    else if (filter === 'done') show = done;
    else if (filter === 'unassigned') show = !assigned;
    else if (filter === 'me') show = assigned === 'me';
    taskEl.classList.toggle('hidden', !show);
  });

  document.querySelectorAll('.zone').forEach(zoneEl => {
    const visible = zoneEl.querySelectorAll('.task:not(.hidden)').length;
    zoneEl.classList.toggle('hidden', visible === 0);
  });

  document.querySelectorAll('.block-section').forEach(blockEl => {
    const visible = blockEl.querySelectorAll('.task:not(.hidden)').length;
    blockEl.classList.toggle('hidden', visible === 0);
  });

  // Contacts card: hide when filtering anything other than 'all'
  const contactsCard = document.querySelector('.contacts-card');
  if (contactsCard) {
    contactsCard.classList.toggle('hidden', filter !== 'all');
  }

  // Empty state: dacă niciun task vizibil, arăt un mesaj
  showEmptyStateIfNeeded(filter);
}

function showEmptyStateIfNeeded(filter) {
  const main = document.getElementById('main');
  if (!main) return;
  // Curăț orice empty state vechi
  const oldEmpty = document.getElementById('emptyState');
  if (oldEmpty) oldEmpty.remove();

  const visibleTasks = document.querySelectorAll('.task:not(.hidden)').length;
  if (visibleTasks === 0 && filter !== 'all') {
    const messages = {
      open: { icon: '✓', title: 'Toate sunt bifate!', sub: 'Felicitări, nimic de făcut.' },
      done: { icon: '○', title: 'Nimic bifat încă', sub: 'Începe să bifezi taskurile finalizate.' },
      unassigned: { icon: '◯', title: 'Toate sunt asignate', sub: 'Fiecare task are pe cineva responsabil.' },
      me: { icon: '●', title: 'Nimic asignat ție', sub: 'Apasă pe „+ Asignează" la un task ca să-l preiei.' }
    };
    const msg = messages[filter] || { icon: '·', title: 'Niciun task', sub: '' };
    const empty = document.createElement('div');
    empty.id = 'emptyState';
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="empty-icon">${msg.icon}</div>
      <div class="empty-title">${msg.title}</div>
      <div class="empty-sub">${msg.sub}</div>
    `;
    main.appendChild(empty);
  }
}

// ===== Keyboard handling: ridică modalul activ când apare tastatura =====
function adjustModalForKeyboard() {
  if (!window.visualViewport) return;
  // Funcția va fi apelată la fiecare deschidere de modal cu input
  // Listener-ul global de pe visualViewport (setat la init) face restul.
}

function setupViewportHandler() {
  if (!window.visualViewport) return;
  const handler = () => {
    const vv = window.visualViewport;
    // Înălțimea efectivă cu tastatura deschisă
    const visibleHeight = vv.height;
    // Aplicăm pe orice modal vizibil
    document.querySelectorAll('.modal-overlay.visible').forEach(overlay => {
      const modal = overlay.querySelector('.modal');
      if (!modal) return;
      // Limităm înălțimea maximă a modalului la viewport-ul vizibil minus o margine
      modal.style.maxHeight = (visibleHeight - 20) + 'px';
      // Dacă modal e atașat la bottom (slide-up), ne asigurăm că e deasupra tastaturii
      if (!overlay.classList.contains('center')) {
        // Pentru modal-uri slide-up: împingem overlay-ul în sus cu offset-ul ascuns
        const offset = (window.innerHeight - vv.height - vv.offsetTop);
        overlay.style.paddingBottom = offset + 'px';
      }
    });
  };
  window.visualViewport.addEventListener('resize', handler);
  window.visualViewport.addEventListener('scroll', handler);

  // La focus pe input dintr-un modal, scroll input-ul în viewport
  document.addEventListener('focusin', (e) => {
    const target = e.target;
    if (!target.matches('input, textarea')) return;
    // Verific dacă e într-un modal vizibil
    const modal = target.closest('.modal');
    if (!modal) return;
    // Așteaptă tastatura să apară (~300ms pe iOS)
    setTimeout(() => {
      try {
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } catch (e) {}
    }, 300);
  });
}

function renderAssignOptions() {
  const container = document.getElementById('assignOptions');
  const search = activeAssignSearch.toLowerCase().trim();
  const currentAssign = activeAssignTaskId ? state.assignments[activeAssignTaskId] : null;
  const allContacts = getAllContacts();

  let html = '';

  // Add new contact option (always at top)
  html += `
    <div class="assign-option add-new" data-pick-contact="__new__">
      <div class="assign-option-icon add-new-icon">+</div>
      <div class="assign-option-info">
        <div class="assign-option-name">Adaugă contact nou${search ? ' „' + activeAssignSearch + '"' : ''}</div>
        <div class="assign-option-meta">Creează și asignează</div>
      </div>
    </div>
  `;

  // Unassign option (only if currently assigned)
  if (currentAssign) {
    html += `
      <div class="assign-option" data-pick-contact="__unassign__">
        <div class="assign-option-icon unassign">−</div>
        <div class="assign-option-info">
          <div class="assign-option-name">Elimină asignare</div>
        </div>
      </div>
    `;
  }

  // Me option
  const meContact = allContacts.find(c => c.id === 'me');
  if (!search || meContact.name.toLowerCase().includes(search)) {
    const selectedClass = currentAssign === 'me' ? 'selected' : '';
    html += `
      <div class="assign-option ${selectedClass}" data-pick-contact="me">
        <div class="assign-option-icon me">EU</div>
        <div class="assign-option-info">
          <div class="assign-option-name">${meContact.name}</div>
          <div class="assign-option-meta">Eu mă ocup</div>
        </div>
      </div>
    `;
  }

  // Group others by category
  const grouped = {};
  allContacts.forEach(c => {
    if (c.special === 'me') return;
    const haystack = `${c.name} ${c.role || ''}`.toLowerCase();
    if (search && !haystack.includes(search)) return;
    if (!grouped[c.category]) grouped[c.category] = [];
    grouped[c.category].push(c);
  });

  Object.keys(grouped).forEach(cat => {
    html += `<div style="font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); padding:0.75rem 0.5rem 0.25rem; font-weight:600">${cat}</div>`;
    grouped[cat].forEach(c => {
      const selectedClass = currentAssign === c.id ? 'selected' : '';
      const initials = c.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const sub = c.role || (c.phone ? c.phone : '');
      const isCustom = c.id.startsWith('custom-') ? ' <span class="custom-badge-sm">custom</span>' : '';
      html += `
        <div class="assign-option ${selectedClass}" data-pick-contact="${c.id}">
          <div class="assign-option-icon">${initials}</div>
          <div class="assign-option-info">
            <div class="assign-option-name">${c.name}${isCustom}</div>
            <div class="assign-option-meta">${sub}</div>
          </div>
        </div>
      `;
    });
  });

  container.innerHTML = html;
}

// ============ EVENT HANDLERS ============
document.addEventListener('click', (e) => {
  // Assign chip click
  const assignTaskId = e.target.closest('[data-assign-task]');
  if (assignTaskId) {
    openAssignModal(assignTaskId.dataset.assignTask);
    e.stopPropagation();
    return;
  }

  // Pick contact in modal
  const pickContact = e.target.closest('[data-pick-contact]');
  if (pickContact && activeAssignTaskId) {
    const contactId = pickContact.dataset.pickContact;
    if (contactId === '__new__') {
      // Open new-contact modal, pre-fill with search if any
      const prefillName = activeAssignSearch.trim();
      const taskIdToAssign = activeAssignTaskId;
      // Close the assign modal first so contact modal sits on top cleanly
      closeAssignModal();
      openContactEditor(null, prefillName, async (newContact) => {
        // After contact saved: assign it to the original task
        state.assignments[taskIdToAssign] = newContact.id;
        await applyAndSync_setAssign(taskIdToAssign, newContact.id);
        saveState();
        showToast(`Adăugat și asignat: ${newContact.name}`);
        // Full re-render so the chip on the task picks up the new contact name
        render();
      });
      return;
    }
    if (contactId === '__unassign__') {
      delete state.assignments[activeAssignTaskId];
      applyAndSync_setAssign(activeAssignTaskId, null);
      showToast('Asignare eliminată');
    } else {
      state.assignments[activeAssignTaskId] = contactId;
      const contact = getContact(contactId);
      applyAndSync_setAssign(activeAssignTaskId, contactId);
      showToast(contact ? `Asignat: ${contact.name}` : 'Asignat');
    }
    updateTaskAssignment(activeAssignTaskId);
    updateMyTasksFab();
    saveState();
    if (state.filter !== 'all') applyFilter();
    closeAssignModal();
    return;
  }

  // Add contact button (from contacts section)
  if (e.target.id === 'addContactBtn') {
    openContactEditor(null, '', (newContact) => {
      showToast(`Adăugat: ${newContact.name}`);
      rerenderContactsSection();
    });
    return;
  }

  // Edit contact (custom only)
  const editContact = e.target.closest('[data-edit-contact]');
  if (editContact) {
    const id = editContact.dataset.editContact;
    const c = state.customContacts.find(cc => cc.id === id);
    if (c) {
      openContactEditor(c, '', () => {
        rerenderContactsSection();
        // Update any tasks displaying this contact
        Object.keys(state.assignments).forEach(taskId => {
          if (state.assignments[taskId] === id) updateTaskAssignment(taskId);
        });
      });
    }
    return;
  }

  // Toggle task
  const toggleId = e.target.dataset.toggleTask;
  if (toggleId) {
    state.done[toggleId] = !state.done[toggleId];
    const taskEl = document.querySelector(`[data-task-id="${toggleId}"]`);
    if (taskEl) taskEl.classList.toggle('done', state.done[toggleId]);
    const blockId = findBlockForTask(toggleId);
    if (blockId) updateBlockProgress(blockId);
    updateGlobalProgress();
    updateMyTasksFab();
    saveState();
    applyAndSync_toggleDone(toggleId, !!state.done[toggleId]);
    if (state.filter !== 'all') applyFilter();
    return;
  }

  // Add custom task button
  const addTaskBtn = e.target.closest('[data-add-task-block]');
  if (addTaskBtn) {
    const blockId = addTaskBtn.dataset.addTaskBlock;
    const block = DATA.find(b => b.id === blockId);
    const blockTitle = block ? block.title : (blockId === 'other' ? 'Altele' : blockId);
    openTaskCreator(blockId, blockTitle);
    return;
  }

  // Delete custom task
  const deleteTaskBtn = e.target.closest('[data-delete-task]');
  if (deleteTaskBtn) {
    e.stopPropagation();
    const taskId = deleteTaskBtn.dataset.deleteTask;
    const blockId = findBlockForTask(taskId);
    const task = findTask(taskId);
    if (!task || !blockId) return;
    showConfirm(
      'Șterge taskul?',
      `Vei elimina "${task.text}" pentru toată echipa. Acțiunea nu poate fi anulată.`,
      async () => {
        await applyAndSync_deleteCustomTask(blockId, taskId);
        showToast('Task șters');
      }
    );
    return;
  }

  // Toggle block
  const blockToggle = e.target.closest('[data-block-toggle]');
  if (blockToggle) {
    const id = blockToggle.dataset.blockToggle;
    state.collapsed[id] = !state.collapsed[id];
    const header = blockToggle;
    const body = header.nextElementSibling;
    if (header.classList.contains('contacts-header')) {
      header.querySelector('.chevron').style.transform = state.collapsed[id] ? 'rotate(-90deg)' : '';
      body.classList.toggle('collapsed', state.collapsed[id]);
    } else {
      header.classList.toggle('collapsed', state.collapsed[id]);
      body.classList.toggle('collapsed', state.collapsed[id]);
    }
    saveState();
    return;
  }

  // Note button
  const noteBtnId = e.target.dataset.noteBtn;
  if (noteBtnId) {
    const noteEl = document.querySelector(`[data-note-for="${noteBtnId}"]`);
    if (noteEl) {
      noteEl.classList.toggle('visible');
      if (noteEl.classList.contains('visible')) {
        const ta = noteEl.querySelector('textarea');
        if (ta) setTimeout(() => ta.focus(), 100);
      }
    }
    return;
  }

  // Filter pills
  if (e.target.classList.contains('pill')) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    state.filter = e.target.dataset.filter;
    saveState();
    applyFilter();
  }
});

    Object.keys(state.customTasks).forEach(b => {
      txt += '  ' + b + ': ' + (state.customTasks[b] || []).length + ' tasks\n';
    });
    txt += '\n=== PENDING WRITES ===\n';
    pendingLocal.writes.forEach((entry, path) => {
      txt += path + ' = ' + JSON.stringify(entry.value).slice(0, 100) + '\n';
    });

    content.textContent = txt;
    panel.appendChild(content);

    // Add button to fetch and show current Firebase state directly
    const fbBtn = document.createElement('button');
    fbBtn.textContent = 'Citește direct Firebase';
    fbBtn.style.cssText = 'display:block;margin:10px 0;padding:10px;background:#2a8a83;color:#fff;border:none;border-radius:6px;width:100%;font-size:14px';
    fbBtn.onclick = async () => {
      try {
        const { get } = await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js');
        const snap = await get(fbRef('/'));
        const val = snap.val();
        content.textContent = '=== FIREBASE RAW ===\n' + JSON.stringify(val, null, 2);
      } catch (e) {
        content.textContent = '=== EROARE CITIRE FB ===\n' + (e.message || e) + '\n\nStack:\n' + (e.stack || '');
      }
    };
    panel.appendChild(fbBtn);

    // Test write button
    const testBtn = document.createElement('button');
    testBtn.textContent = 'Test scriere Firebase (test/ping)';
    testBtn.style.cssText = 'display:block;margin:10px 0;padding:10px;background:#d4a55a;color:#000;border:none;border-radius:6px;width:100%;font-size:14px';
    testBtn.onclick = async () => {
      try {
        await fbUpdate('test/ping', Date.now());
        content.textContent = '=== TEST WRITE OK ===\nScrierea a reușit la /test/ping';
      } catch (e) {
        content.textContent = '=== EROARE SCRIERE TEST ===\n' + (e.message || e) + '\n' + (e.code || '') + '\n\nStack:\n' + (e.stack || '');
      }
    };
    panel.appendChild(testBtn);

    document.body.appendChild(panel);
  }

  if (wordmark) {
    let pressTimer = null;
    wordmark.addEventListener('pointerdown', () => {
      pressTimer = setTimeout(showDebugPanel, 1500);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
      wordmark.addEventListener(ev, () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      });
    });
  }

  // Triple-tap pe procentaj global
  if (percentEl) {
    let tapCount = 0, tapTimer = null;
    percentEl.addEventListener('click', () => {
      tapCount++;
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 500);
      if (tapCount >= 3) { tapCount = 0; showDebugPanel(); }
    });
  }
})();

// Picker modal interactions
document.getElementById('pickerList').addEventListener('click', handlePickerClick);
document.getElementById('pickerBack').addEventListener('click', handlePickerClick);

  if (e.target.id === 'taskPickerModal') closeTaskPicker();

// ============ CONFIRM MODAL ============
function showConfirm(title, text, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmModal').classList.add('visible');
  const confirm = document.getElementById('confirmOk');
  const newConfirm = confirm.cloneNode(true);
  confirm.parentNode.replaceChild(newConfirm, confirm);
  newConfirm.addEventListener('click', () => {
    onConfirm();
    document.getElementById('confirmModal').classList.remove('visible');
  });
}

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('visible');
});

document.getElementById('confirmModal').addEventListener('click', (e) => {
  if (e.target.id === 'confirmModal') document.getElementById('confirmModal').classList.remove('visible');
});

// ============ RESET ============
document.getElementById('resetBtn').addEventListener('click', () => {
  showConfirm(
    'Resetează vederea locală?',
    'Această acțiune afectează DOAR acest dispozitiv: ce blocuri sunt deschise, filtrul activ, numele tău. Datele echipei (bife, asignări, contacte) nu se șterg. Pentru a șterge tot pentru toată echipa, ține apăsat 2 secunde pe butonul Reset.',
    () => {
      state.collapsed = {};
      state.filter = 'all';
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      const allPill = document.querySelector('[data-filter="all"]');
      if (allPill) allPill.classList.add('active');
      localStorage.removeItem('merakiActor');
      sync.actor = getActorName();
      saveState();
      render();
      updateSyncBadge();
      showToast('Vedere locală resetată');
    }
  );
});

// Long-press reset → global wipe
let resetPressTimer = null;
const resetBtnEl = document.getElementById('resetBtn');
resetBtnEl.addEventListener('pointerdown', () => {
  resetPressTimer = setTimeout(() => {
    resetPressTimer = null;
    showConfirm(
      '⚠️ Reset COMPLET pentru toată echipa?',
      'Vei șterge TOATE bifele, asignările, notele și contactele adăugate, pentru toți cei care folosesc acest checklist. Acțiunea NU poate fi anulată. Continuă doar dacă ești absolut sigur.',
      async () => {
        // Wipe Firebase state in one shot
        try {
          await window.fb.set(fbRef('/'), {
            done: {},
            notes: {},
            assignments: {},
            customContacts: {},
            customCategories: [],
            audit: {}
          });
          fbPushAudit({ ts: Date.now(), actor: sync.actor + ' (RESET TOTAL)', action: 'reset complet' });
          showToast('Resetat complet pentru toată echipa');
          // Listener-ul Firebase va re-hidrata automat starea + render
        } catch (e) {
          showToast('Eroare la reset — verifică conexiunea');
          console.error('Reset failed:', e);
        }
      }
    );
  }, 2000);
});

['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
  resetBtnEl.addEventListener(ev, () => {
    if (resetPressTimer) { clearTimeout(resetPressTimer); resetPressTimer = null; }
  });
});

// ============ EXPORT ============
document.getElementById('exportBtn').addEventListener('click', () => {
  let txt = `MERAKI LAGO RESORT & SPA\nCHECKLIST ȘANTIER — ${new Date().toLocaleDateString('ro-RO')}\n`;
  txt += '═'.repeat(50) + '\n\n';

  const gs = getGlobalStats();
  txt += `PROGRES GENERAL: ${gs.done}/${gs.total} (${gs.percent}%)\n\n`;

  DATA.forEach(block => {
    if (!block.zones) return;
    const bs = getBlockStats(block);
    txt += `\n${block.title.toUpperCase()} — ${bs.done}/${bs.total} (${bs.percent}%)\n`;
    txt += '─'.repeat(40) + '\n';
    block.zones.forEach(zone => {
      txt += `\n  ${zone.title}${zone.sub ? ' — ' + zone.sub.replace(/&amp;/g, '&') : ''}\n`;
      zone.tasks.forEach(task => {
        const mark = state.done[task.id] ? '[x]' : '[ ]';
        const assignId = state.assignments[task.id];
        const contact = assignId ? getContact(assignId) : null;
        const assign = contact ? `  ⟶ ${contact.name}${contact.role ? ' (' + contact.role + ')' : ''}${contact.phone ? ' · ' + contact.phone : ''}` : '';
        const urg = task.urgent ? ' ⚠' : '';
        txt += `  ${mark} ${task.text}${assign}${urg}\n`;
        if (state.notes[task.id]) txt += `      notă: ${state.notes[task.id]}\n`;
      });
    });
    txt += '\n';
  });

  // Contacts at end
  txt += `\nCONTACTE\n` + '═'.repeat(50) + '\n';
  const groupedC = {};
  getAllContacts().forEach(c => {
    if (c.special === 'me') return;
    if (!groupedC[c.category]) groupedC[c.category] = [];
    groupedC[c.category].push(c);
  });
  Object.keys(groupedC).forEach(cat => {
    txt += `\n  ${cat}\n`;
    groupedC[cat].forEach(c => {
      const role = c.role ? ` – ${c.role}` : '';
      const phone = c.phone ? ` · ${c.phone}` : '';
      txt += `    ${c.name}${role}${phone}\n`;
    });
  });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `checklist_meraki_lago_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export descărcat');
});

// ============ TOAST ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 1800);
}

// Sync badge: click → schimbă numele afișat
document.getElementById('syncBadge').addEventListener('click', () => {
  const current = sync.actor || '';
  const newName = prompt('Numele tău (apare în istoric pentru ceilalți):', current);
  if (newName !== null) {
    setActorName(newName);
  }
});

// ============ INIT ============
async function init() {
  // Set actor first (will prompt if missing)
  sync.actor = getActorName();

  // Load any local-only fields (collapsed, filter) from localStorage right away
  try {
    const localRaw = localStorage.getItem(STORAGE_KEY);
    if (localRaw) {
      const localState = JSON.parse(localRaw);
      state.collapsed = localState.collapsed || {};
      state.filter = localState.filter || 'all';
    }
  } catch (e) {}

  // Render once with empty state (Firebase listener will populate immediately)
  render();
  updateSyncBadge();
  setupViewportHandler();

  // Wait for Firebase SDK to be ready (loaded async via <script type="module">)
  let waited = 0;
  while ((!window.firebaseDb || !window.fb) && waited < 5000) {
    await new Promise(r => setTimeout(r, 100));
    waited += 100;
  }

  if (!window.firebaseDb) {
    console.error('Firebase did not load in time');
    showToast('Eroare conectare — folosesc copie locală');
    loadState();
    render();
    return;
  }

  // Start the realtime listener (first onValue callback hydrates state from server)
  startFirebaseSync();
}

init();
