<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Checklist Șantier — Meraki Lago Resort & Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-deep: #0d4f4a;
    --teal: #1a6b66;
    --teal-light: #2a8a83;
    --lake: #6ba89f;
    --amber: #c9954a;
    --amber-light: #e0b06a;
    --cream: #f5efe2;
    --cream-warm: #ede4cf;
    --paper: #fbf7ec;
    --ink: #1f2421;
    --ink-soft: #4a534e;
    --muted: #8a9189;
    --line: #d9d0bd;
    --line-soft: #e8e0cc;
    --done-bg: #e8f0ed;
    --done-text: #6b7d76;
    --danger: #b04a3a;
    --me: #1a6b66;
    --shadow-sm: 0 1px 3px rgba(13, 79, 74, 0.08);
    --shadow-md: 0 4px 16px rgba(13, 79, 74, 0.10);
    --shadow-lg: 0 12px 40px rgba(13, 79, 74, 0.14);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201, 149, 74, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(26, 107, 102, 0.05) 0%, transparent 40%);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ============ HEADER ============ */
  header.app-header {
    background: linear-gradient(180deg, #ffffff 0%, #fdfbf5 100%);
    color: var(--ink);
    padding: calc(env(safe-area-inset-top) + 0.6rem) 1rem 0.65rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 1px 0 rgba(13, 79, 74, 0.03);
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .wordmark {
    flex: 1;
    min-width: 0;
    line-height: 1;
  }

  .wordmark-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .wordmark-brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.22em;
    color: var(--teal-deep);
    line-height: 1;
  }

  /* Λ instead of A for brand consistency with merakiestate.ro */
  .wordmark-brand .lambda {
    font-family: 'Cormorant Garamond', serif;
    font-style: normal;
    font-weight: 500;
    color: var(--amber);
  }

  .wordmark-divider {
    color: var(--line);
    font-weight: 300;
    font-size: 0.9rem;
  }

  .wordmark-project {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wordmark-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.4rem;
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .wordmark-meta .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }

  .progress-mini {
    flex: 1;
    height: 3px;
    background: var(--line-soft);
    border-radius: 100px;
    overflow: hidden;
    min-width: 30px;
    max-width: 80px;
  }

  .progress-mini-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--teal) 0%, var(--amber) 100%);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 100px;
  }

  .progress-percent {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--teal-deep);
    letter-spacing: 0;
  }

  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.15rem 0.55rem 0.15rem 0.45rem;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-left: auto;
    max-width: 110px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .sync-badge:active { transform: scale(0.96); }

  .sync-badge .sync-dot {
    font-size: 0.65rem;
    line-height: 1;
  }

  .sync-badge.ok .sync-dot { color: #2a8a83; }
  .sync-badge.pending .sync-dot { color: var(--amber); }
  .sync-badge.syncing .sync-dot {
    color: var(--teal);
    animation: spin 1s linear infinite;
    display: inline-block;
  }
  .sync-badge.offline {
    border-color: var(--danger);
    color: var(--danger);
  }
  .sync-badge.offline .sync-dot { color: var(--danger); }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .header-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
    padding: 0;
  }

  .icon-btn:active {
    background: var(--cream-warm);
    transform: scale(0.95);
  }

  /* legacy progress styles (no longer used in compact header) */

  /* ============ FILTER PILLS ============ */
  .filter-bar {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.75rem 1rem 0.5rem;
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .pill {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.4rem 0.85rem;
    border-radius: 100px;
    font-family: 'Jost', sans-serif;
    font-size: 0.73rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .pill.active {
    background: var(--teal-deep);
    color: var(--cream);
    border-color: var(--teal-deep);
  }

  .pill:active { transform: scale(0.96); }

  /* ============ MAIN ============ */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.5rem 1.25rem 4rem;
  }

  /* ============ BLOCK SECTIONS ============ */
  .block-section {
    background: var(--cream);
    border-radius: 14px;
    margin-bottom: 1.25rem;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line-soft);
  }

  .block-header {
    padding: 1rem 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    background: linear-gradient(180deg, var(--cream-warm) 0%, var(--cream) 100%);
    border-bottom: 1px solid var(--line-soft);
    user-select: none;
  }

  .block-header.collapsed { border-bottom: 1px solid transparent; }

  .block-icon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--teal-deep);
    background: var(--paper);
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--line-soft);
  }

  .block-info { flex: 1; min-width: 0; }

  .block-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--teal-deep);
    letter-spacing: 0.01em;
    line-height: 1.1;
  }

  .block-meta {
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    font-weight: 500;
  }

  .block-progress-wrap { display: flex; align-items: center; gap: 0.5rem; }

  .block-progress {
    width: 50px;
    height: 50px;
    position: relative;
    flex-shrink: 0;
  }

  .block-progress svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .block-progress circle {
    fill: none;
    stroke-width: 4;
  }

  .block-progress .bg-circle { stroke: var(--line-soft); }
  .block-progress .fg-circle {
    stroke: var(--amber);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s;
  }

  .block-progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--teal-deep);
  }

  .chevron {
    color: var(--ink-soft);
    transition: transform 0.3s;
    font-size: 0.85rem;
  }

  .block-header.collapsed .chevron { transform: rotate(-90deg); }

  .block-body {
    padding: 0.5rem 0;
    max-height: 30000px;
    transition: max-height 0.4s ease, padding 0.3s;
    overflow: hidden;
  }

  .block-body.collapsed { max-height: 0; padding: 0; }

  /* ============ ZONES ============ */
  .zone {
    padding: 0.75rem 1.1rem;
    border-top: 1px solid var(--line-soft);
  }
  .zone:first-child { border-top: none; }

  .zone-title {
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
    margin: 0 0 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .zone-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line) 0%, transparent 100%);
  }

  .zone-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }

  /* ============ TASKS ============ */
  .task-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.65rem 0.25rem;
    border-radius: 6px;
    transition: background 0.15s;
    position: relative;
    border-bottom: 1px solid rgba(217, 208, 189, 0.3);
  }

  .task:last-child { border-bottom: none; }
  .task:active { background: var(--paper); }

  .task-checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--lake);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    transition: all 0.2s;
    cursor: pointer;
  }

  .task.done .task-checkbox {
    background: var(--teal);
    border-color: var(--teal);
  }

  .task-checkbox::after {
    content: '';
    width: 6px;
    height: 11px;
    border: solid var(--cream);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }

  .task.done .task-checkbox::after { transform: rotate(45deg) scale(1); }

  .task-content { flex: 1; min-width: 0; cursor: pointer; }

  .task-text {
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--ink);
    word-wrap: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    text-decoration-color: var(--muted);
    color: var(--done-text);
  }

  .task-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    text-transform: uppercase;
    margin-left: 0.4rem;
    vertical-align: 2px;
    background: var(--danger);
    color: var(--cream);
  }

  /* Assignment chip */
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.35rem;
    align-items: center;
  }

  .assign-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 0.25rem 0.6rem 0.25rem 0.5rem;
    border-radius: 100px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .assign-chip:active { transform: scale(0.97); }

  .assign-chip .chip-icon {
    font-size: 0.85rem;
    line-height: 1;
  }

  .assign-chip.unassigned {
    background: transparent;
    border-style: dashed;
    color: var(--muted);
  }

  .assign-chip.assigned-me {
    background: var(--me);
    color: var(--cream);
    border-color: var(--me);
  }

  .assign-chip.assigned-contact {
    background: var(--teal-light);
    color: var(--cream);
    border-color: var(--teal-light);
  }

  .call-btn {
    background: var(--amber);
    color: var(--cream);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
  }

  .call-btn:active { transform: scale(0.92); }

  .task-note-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    padding: 0.25rem 0.4rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    align-self: flex-start;
    margin-top: 1px;
  }

  .task-note-btn.has-note {
    opacity: 1;
    color: var(--amber);
  }

  .task-note {
    background: var(--paper);
    border-left: 3px solid var(--amber);
    padding: 0.6rem 0.8rem;
    margin: 0.4rem 0 0.2rem 0;
    border-radius: 0 6px 6px 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    display: none;
  }

  .task-note.visible { display: block; }

  .task-note textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-family: inherit;
    font-style: inherit;
    color: inherit;
    font-size: inherit;
    resize: vertical;
    min-height: 40px;
    outline: none;
  }

  /* ============ CONTACTS SECTION ============ */
  .contacts-card {
    background: linear-gradient(135deg, #0a3935 0%, #134f4a 100%);
    color: var(--cream);
    border-radius: 14px;
    padding: 1.1rem 0 0;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .contacts-header {
    padding: 0 1.1rem 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .contacts-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--amber-light);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .contacts-count {
    font-size: 0.7rem;
    color: rgba(245, 239, 226, 0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.15rem;
  }

  .contacts-list {
    max-height: 5000px;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  .contacts-list.collapsed { max-height: 0; }

  .contact-category {
    padding: 0.6rem 1.1rem 0.3rem;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(224, 176, 106, 0.7);
    font-weight: 600;
    background: rgba(0, 0, 0, 0.15);
  }

  .contact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.65rem 1.1rem;
    border-top: 1px solid rgba(245, 239, 226, 0.06);
    border-left: 3px solid var(--amber);
  }

  .contact-info {
    flex: 1;
    min-width: 0;
  }

  .contact-name {
    font-weight: 500;
    color: var(--cream);
    font-size: 0.9rem;
    line-height: 1.2;
  }

  .contact-phone {
    color: var(--amber-light);
    font-size: 0.78rem;
    text-decoration: none;
    letter-spacing: 0.03em;
    margin-top: 0.15rem;
    display: block;
  }

  .contact-actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .contact-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    color: var(--cream);
  }

  .contact-btn.call { background: var(--amber); }
  .contact-btn.sms {
    background: rgba(245, 239, 226, 0.15);
    border: 1px solid rgba(245, 239, 226, 0.2);
  }

  /* ============ ASSIGN MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 79, 74, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }

  .modal-overlay.visible { display: flex; }
  .modal-overlay.center { align-items: center; padding: 1rem; }

  .modal {
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
    max-width: 500px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }

  .modal.center-modal {
    border-radius: 14px;
    max-width: 400px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.45rem;
    margin: 0 0 0.3rem;
    color: var(--teal-deep);
    font-weight: 600;
  }

  .modal-task {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0 0 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--line-soft);
    line-height: 1.4;
  }

  .modal p {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 1.25rem;
  }

  .assign-search {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--cream);
    margin-bottom: 0.75rem;
    outline: none;
  }

  .assign-search:focus { border-color: var(--teal); }

  .assign-options {
    max-height: 50vh;
    overflow-y: auto;
    margin: 0 -0.5rem;
  }

  .assign-option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 0.5rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .assign-option:active { background: var(--cream-warm); }

  .assign-option-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--teal-light);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .assign-option-icon.me {
    background: var(--me);
  }

  .assign-option-icon.unassign {
    background: transparent;
    border: 1.5px dashed var(--muted);
    color: var(--muted);
  }

  .assign-option-info { flex: 1; min-width: 0; }

  .assign-option-name {
    font-weight: 500;
    color: var(--ink);
    font-size: 0.92rem;
  }

  .assign-option-meta {

// ============ STATE ============
const STORAGE_KEY = 'merakiLagoChecklist_v3';
let state = {
  done: {},
  notes: {},
  collapsed: {},
  assignments: {},
  customContacts: [],  // user-added contacts
  customCategories: [], // user-added category names
  filter: 'all'
};

let activeAssignTaskId = null;
let activeAssignSearch = '';

// Merged list of all contacts (seed + custom)
function getAllContacts() {
  return [...SEED_CONTACTS, ...state.customContacts];
}

// Get list of all categories (used in pickers)
function getAllCategories() {
  const fromSeed = [...new Set(SEED_CONTACTS.filter(c => !c.special).map(c => c.category))];
  const fromCustom = [...new Set(state.customContacts.map(c => c.category))];
  const fromExtra = state.customCategories || [];
  return [...new Set([...fromSeed, ...fromCustom, ...fromExtra])];
}

function generateContactId(name) {
  const base = name.toLowerCase()
    .replace(/[ăâ]/g, 'a').replace(/[î]/g, 'i').replace(/[șş]/g, 's').replace(/[țţ]/g, 't')
    .replace(/[^a-z0-9]/g, '-')
    .replace(/-+/g, '-').replace(/^-|-$/g, '');
  let id = 'custom-' + (base || 'contact');
  let n = 1;
  const existing = new Set(getAllContacts().map(c => c.id));
  let candidate = id;
  while (existing.has(candidate)) {
    n++;
    candidate = `${id}-${n}`;
  }
  return candidate;
}

// ============ SERVER SYNC ============
const API_BASE = '/api';
const POLL_INTERVAL_MS = 5000;
const FLUSH_DEBOUNCE_MS = 600;

const sync = {
  pendingOps: [],
  flushTimer: null,
  pollTimer: null,
  serverVersion: 0,
  online: true,
  syncing: false,
  actor: null,
  inFlight: 0,
  errorCount: 0
};

function getActorName() {
  // Persist a display name per device
  let name = localStorage.getItem('merakiActor');
  if (!name) {
    name = prompt('Cum vrei să apari pentru ceilalți? (ex: Meraki, Marian, șef șantier)') || 'anonim';
    name = name.trim().slice(0, 40) || 'anonim';
    localStorage.setItem('merakiActor', name);
  }
  return name;
}

function setActorName(name) {
  const clean = (name || '').trim().slice(0, 40);
  if (!clean) return;
  localStorage.setItem('merakiActor', clean);
  sync.actor = clean;
  updateSyncBadge();
}

function updateSyncBadge() {
  const badge = document.getElementById('syncBadge');
  if (!badge) return;
  let cls = 'ok', label = '●';
  if (sync.syncing) { cls = 'syncing'; label = '⟳'; }
  else if (!sync.online) { cls = 'offline'; label = '○'; }
  else if (sync.pendingOps.length > 0) { cls = 'pending'; label = '●'; }
  badge.className = 'sync-badge ' + cls;
  const actorEl = document.getElementById('syncActor');
  if (actorEl) actorEl.textContent = sync.actor || '...';
  const dotEl = badge.querySelector('.sync-dot');
  if (dotEl) dotEl.textContent = label;
}

function queueOp(op) {
  sync.pendingOps.push(op);
  updateSyncBadge();
  scheduleFlush();
}

function scheduleFlush() {
  if (sync.flushTimer) clearTimeout(sync.flushTimer);
  sync.flushTimer = setTimeout(flushOps, FLUSH_DEBOUNCE_MS);
}

async function flushOps() {
  if (sync.pendingOps.length === 0) return;
  if (sync.inFlight > 0) {
    // Already sending; retry after current finishes
    scheduleFlush();
    return;
  }
  const batch = sync.pendingOps.splice(0); // take all
  sync.syncing = true;
  sync.inFlight++;
  updateSyncBadge();
  try {
    const resp = await fetch(API_BASE + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actor: sync.actor, ops: batch })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const serverState = await resp.json();
    sync.serverVersion = serverState.version || 0;
    sync.online = true;
    sync.errorCount = 0;
    // Reconcile: merge server state back (handles concurrent edits)
    reconcileFromServer(serverState);
  } catch (e) {
    console.warn('Flush failed:', e.message);
    // Put back the ops to retry
    sync.pendingOps = batch.concat(sync.pendingOps);
    sync.online = false;
    sync.errorCount++;
    // Exponential backoff retry
    const delay = Math.min(30000, 1000 * Math.pow(2, Math.min(sync.errorCount, 5)));
    setTimeout(scheduleFlush, delay);
  } finally {
    sync.inFlight--;
    sync.syncing = false;
    updateSyncBadge();
  }
}

async function pollState() {
  if (sync.pendingOps.length > 0 || sync.inFlight > 0) {
    // Don't poll while we have local changes to flush; flushOps returns latest state anyway
    return;
  }
  try {
    const resp = await fetch(API_BASE + '/state', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const serverState = await resp.json();
    sync.online = true;
    sync.errorCount = 0;
    if ((serverState.version || 0) !== sync.serverVersion) {
      sync.serverVersion = serverState.version || 0;
      reconcileFromServer(serverState);
    }
  } catch (e) {
    sync.online = false;
    sync.errorCount++;
  } finally {
    updateSyncBadge();
  }
}

function reconcileFromServer(serverState) {
  // Server is source of truth. Replace fields. Keep local-only fields (collapsed, filter).
  const collapsed = state.collapsed;
  const filter = state.filter;
  state.done = serverState.done || {};
  state.notes = serverState.notes || {};
  state.assignments = serverState.assignments || {};
  state.customContacts = serverState.customContacts || [];
  state.customCategories = serverState.customCategories || [];
  state.collapsed = collapsed;
  state.filter = filter;

  // Re-apply default assignments where none set
  DATA.forEach(block => {
    if (block.zones) {
      block.zones.forEach(zone => {
        zone.tasks.forEach(task => {
          if (task.defaultAssign && !(task.id in state.assignments)) {
            state.assignments[task.id] = task.defaultAssign;
          }
        });
      });
    }
  });

  // Persist locally as fallback
  saveState();
  // Re-render
  render();
}

async function fetchInitialState() {
  try {
    const resp = await fetch(API_BASE + '/state', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const serverState = await resp.json();
    sync.serverVersion = serverState.version || 0;
    sync.online = true;
    return serverState;
  } catch (e) {
    console.warn('Initial state fetch failed:', e.message);
    sync.online = false;
    return null;
  }
}

function startSyncPolling() {
  if (sync.pollTimer) clearInterval(sync.pollTimer);
  sync.pollTimer = setInterval(pollState, POLL_INTERVAL_MS);
  // Also poll when tab becomes visible
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pollState();
  });
}

// ============ STATE LOADING (fallback offline) ============
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      if (!Array.isArray(state.customContacts)) state.customContacts = [];
      if (!Array.isArray(state.customCategories)) state.customCategories = [];
    }
  } catch (e) { console.warn('Load fail', e); }

  // Apply default assignments where none set
  DATA.forEach(block => {
    if (block.zones) {
      block.zones.forEach(zone => {
        zone.tasks.forEach(task => {
          if (task.defaultAssign && !(task.id in state.assignments)) {
            state.assignments[task.id] = task.defaultAssign;
          }
        });
      });
    }
  });
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('Save fail', e); }
}

// ============ HELPERS ============
function getContact(id) {
  return getAllContacts().find(c => c.id === id);
}

function findTask(id) {
  for (const block of DATA) {
    if (!block.zones) continue;
    for (const zone of block.zones) {
      const t = zone.tasks.find(t => t.id === id);
      if (t) return t;
    }
  }
  return null;
}

function findBlockForTask(id) {
  for (const block of DATA) {
    if (!block.zones) continue;
    for (const zone of block.zones) {
      if (zone.tasks.find(t => t.id === id)) return block.id;
    }
  }
  return null;
}

function getBlockStats(block) {
  let total = 0, done = 0;
  if (!block.zones) return { total: 0, done: 0, percent: 0 };
  block.zones.forEach(zone => {
    zone.tasks.forEach(task => {
      total++;
      if (state.done[task.id]) done++;
    });
  });
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function getGlobalStats() {
  let total = 0, done = 0;
  DATA.forEach(block => {
    if (!block.zones) return;
    const s = getBlockStats(block);
    total += s.total;
    done += s.done;
  });
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function getMyTaskCount() {
  let count = 0;
  Object.keys(state.assignments).forEach(taskId => {
    if (state.assignments[taskId] === 'me' && !state.done[taskId]) count++;
  });
  return count;
}

  const main = document.getElementById('main');
  main.innerHTML = '';

  DATA.forEach(block => {
    if (block.isContacts) {
      main.appendChild(renderContacts(block));
    } else {
      main.appendChild(renderBlock(block));
    }
  });

  updateGlobalProgress();
  updateMyTasksFab();
  applyFilter();
}

function renderBlock(block) {
  const blockEl = document.createElement('section');
  blockEl.className = 'block-section';
  blockEl.dataset.blockId = block.id;

  const stats = getBlockStats(block);
  const isCollapsed = state.collapsed[block.id];

  blockEl.innerHTML = `
    <div class="block-header ${isCollapsed ? 'collapsed' : ''}" data-block-toggle="${block.id}">
      <div class="block-icon">${block.icon}</div>
      <div class="block-info">
        <div class="block-title">${block.title}</div>
        <div class="block-meta">${block.meta} · ${stats.done}/${stats.total}</div>
      </div>
      <div class="block-progress-wrap">
        <div class="block-progress">
          <svg viewBox="0 0 50 50">
            <circle class="bg-circle" cx="25" cy="25" r="20"></circle>
            <circle class="fg-circle" cx="25" cy="25" r="20"
              stroke-dasharray="125.6"
              stroke-dashoffset="${125.6 * (1 - stats.percent / 100)}"></circle>
          </svg>
          <div class="block-progress-text">${stats.percent}%</div>
        </div>
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="block-body ${isCollapsed ? 'collapsed' : ''}">
      ${block.zones.map(zone => renderZone(zone)).join('')}
    </div>
  `;

  return blockEl;
}

function renderZone(zone) {
  return `
    <div class="zone">
      <h3 class="zone-title">
        <span>${zone.title}${zone.sub ? ` <span class="zone-sub">${zone.sub}</span>` : ''}</span>
      </h3>
      <ul class="task-list">
        ${zone.tasks.map(task => renderTask(task)).join('')}
      </ul>
    </div>
  `;
}

function renderTask(task) {
  const done = state.done[task.id];
  const note = state.notes[task.id] || '';
  const hasNote = note.length > 0;
  const urgentTag = task.urgent ? `<span class="task-tag">Urgent</span>` : '';

  const assignedId = state.assignments[task.id];
  const assignedContact = assignedId ? getContact(assignedId) : null;

  let chipHtml = '';
  let callBtn = '';

  if (!assignedContact) {
    chipHtml = `<span class="assign-chip unassigned" data-assign-task="${task.id}">
      <span class="chip-icon">+</span> Asignează
    </span>`;
  } else if (assignedContact.special === 'me') {
    chipHtml = `<span class="assign-chip assigned-me" data-assign-task="${task.id}">
      <span class="chip-icon">●</span> ${assignedContact.name}
    </span>`;
  } else {
    const roleSuffix = assignedContact.role ? ` · ${assignedContact.role}` : '';
    chipHtml = `<span class="assign-chip assigned-contact" data-assign-task="${task.id}">
      <span class="chip-icon">●</span> ${assignedContact.name}${roleSuffix}
    </span>`;
    if (assignedContact.phone) {
      callBtn = `<a href="tel:${assignedContact.phone}" class="call-btn" title="Sună ${assignedContact.name}" onclick="event.stopPropagation()">☎</a>`;
    }
  }

  return `
    <li class="task ${done ? 'done' : ''}" data-task-id="${task.id}">
      <div class="task-checkbox" data-toggle-task="${task.id}"></div>
      <div class="task-content">
        <div class="task-text" data-toggle-task="${task.id}">${task.text}${urgentTag}</div>
        <div class="task-meta">
          ${chipHtml}
          ${callBtn}
        </div>
        <div class="task-note ${hasNote ? 'visible' : ''}" data-note-for="${task.id}">
          <textarea placeholder="Notă..." data-note-input="${task.id}">${note}</textarea>
        </div>
      </div>
      <button class="task-note-btn ${hasNote ? 'has-note' : ''}" data-note-btn="${task.id}" title="Notă">✎</button>
    </li>
  `;
}

function renderContacts(block) {
  const sectionEl = document.createElement('section');
  sectionEl.className = 'contacts-card';

  const allContacts = getAllContacts();
  const grouped = {};
  allContacts.forEach(c => {
    if (c.special === 'me') return;
    if (!grouped[c.category]) grouped[c.category] = [];
    grouped[c.category].push(c);
  });

  const isCollapsed = state.collapsed['contacts'];
  const totalCount = allContacts.length - 1; // exclude "me"

  let html = `
    <div class="contacts-header" data-block-toggle="contacts">
      <div>
        <div class="contacts-title">Contacte</div>
        <div class="contacts-count">${totalCount} colaboratori</div>
      </div>
      <span class="chevron" style="color: var(--amber-light); ${isCollapsed ? 'transform: rotate(-90deg);' : ''}">▼</span>
    </div>
    <div class="contacts-list ${isCollapsed ? 'collapsed' : ''}">
      <div class="contact-add-btn-wrap">
        <button class="contact-add-btn" id="addContactBtn">+ Adaugă contact nou</button>
      </div>
  `;

  Object.keys(grouped).forEach(category => {
    html += `<div class="contact-category">${category}</div>`;
    grouped[category].forEach(c => {
      const displayName = c.role ? `${c.name} — ${c.role}` : c.name;
      const phoneHtml = c.phone ? `<a href="tel:${c.phone}" class="contact-phone">${c.phone}</a>` : `<span class="contact-phone" style="opacity:0.4">fără telefon</span>`;
      const isCustom = c.id.startsWith('custom-');
      const editBtn = isCustom ? `<button class="contact-btn edit" data-edit-contact="${c.id}" title="Editează">✎</button>` : '';
      const actions = `
        <div class="contact-actions">
          ${c.phone ? `<a href="tel:${c.phone}" class="contact-btn call" title="Sună">☎</a>` : ''}
          ${c.phone ? `<a href="sms:${c.phone}" class="contact-btn sms" title="SMS">✉</a>` : ''}
          ${editBtn}
        </div>
      `;
      html += `
        <div class="contact-row">
          <div class="contact-info">
            <div class="contact-name">${displayName}${isCustom ? ' <span class="custom-badge">custom</span>' : ''}</div>
            ${phoneHtml}
          </div>
          ${actions}
        </div>
      `;
    });
  });

  html += `</div>`;
  sectionEl.innerHTML = html;
  return sectionEl;
}

function updateGlobalProgress() {
  const s = getGlobalStats();
  document.getElementById('globalBar').style.width = s.percent + '%';
  document.getElementById('globalText').textContent = `${s.done}/${s.total}`;
  document.getElementById('globalPercent').textContent = s.percent + '%';
}

function updateBlockProgress(blockId) {
  const block = DATA.find(b => b.id === blockId);
  if (!block || !block.zones) return;
  const stats = getBlockStats(block);
  const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);

function openContactEditor(existingContact, prefillName, callback) {
  activeContactEditor = {
    contact: existingContact,
    callback: callback,
    selectedCategory: existingContact ? existingContact.category : 'Subcontractori'
  };

  document.getElementById('contactModalTitle').textContent = existingContact ? 'Editează contact' : 'Contact nou';
  document.getElementById('contactName').value = existingContact ? existingContact.name : (prefillName || '');
  document.getElementById('contactRole').value = existingContact ? (existingContact.role || '') : '';
  document.getElementById('contactPhone').value = existingContact ? (existingContact.phone || '') : '';
  document.getElementById('contactNewCategory').value = '';
  document.getElementById('contactNewCategory').style.display = 'none';

  // Show delete button only for existing custom contacts
  document.getElementById('contactDeleteBtn').style.display = existingContact ? 'inline-block' : 'none';

  renderCategoryPicker();
  document.getElementById('contactModal').classList.add('visible');
  setTimeout(() => {
    if (!existingContact) document.getElementById('contactName').focus();
  }, 200);
}

function closeContactEditor() {
  document.getElementById('contactModal').classList.remove('visible');
  activeContactEditor = { contact: null, callback: null, selectedCategory: '' };
}

function renderCategoryPicker() {
  const picker = document.getElementById('categoryPicker');
  const cats = getAllCategories().filter(c => c !== 'Eu');
  // Ensure default cats exist
  if (!cats.includes('Subcontractori')) cats.unshift('Subcontractori');
  if (!cats.includes('Furnizori')) cats.push('Furnizori');

  let html = '';
  cats.forEach(cat => {
    const sel = activeContactEditor.selectedCategory === cat ? 'selected' : '';
    html += `<button type="button" class="cat-chip ${sel}" data-cat-pick="${cat}">${cat}</button>`;
  });
  html += `<button type="button" class="cat-chip new-cat" data-cat-pick="__new__">+ Categorie nouă</button>`;
  picker.innerHTML = html;
}

function saveContactFromEditor() {
  const name = document.getElementById('contactName').value.trim();
  const role = document.getElementById('contactRole').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  let category = activeContactEditor.selectedCategory;
  let newCategoryAdded = null;

  // If "new category" was active, use the input
  const newCatInput = document.getElementById('contactNewCategory');
  if (newCatInput.style.display !== 'none') {
    const newCat = newCatInput.value.trim();
    if (newCat) {
      category = newCat;
      if (!state.customCategories.includes(newCat)) {
        state.customCategories.push(newCat);
        newCategoryAdded = newCat;
      }
    }
  }

  if (!name) {
    document.getElementById('contactName').focus();
    document.getElementById('contactName').style.borderColor = 'var(--danger)';
    return null;
  }

  if (!category) category = 'Subcontractori';

  if (newCategoryAdded) {
    queueOp({ type: 'addCategory', name: newCategoryAdded });
  }

  if (activeContactEditor.contact) {
    // Edit existing
    const c = state.customContacts.find(cc => cc.id === activeContactEditor.contact.id);
    if (c) {
      c.name = name;
      c.role = role;
      c.phone = phone;
      c.category = category;
    }
    saveState();
    queueOp({ type: 'updateContact', contact: { id: c.id, name, role, phone, category } });
    if (activeContactEditor.callback) activeContactEditor.callback(c);
    closeContactEditor();
    return c;
  } else {
    // Create new
    const newContact = {
      id: generateContactId(name),
      name: name,
      role: role,
      phone: phone,
      category: category
    };
    state.customContacts.push(newContact);
    saveState();
    queueOp({ type: 'addContact', contact: newContact });
    if (activeContactEditor.callback) activeContactEditor.callback(newContact);
    closeContactEditor();
    return newContact;
  }
}

function deleteCurrentContact() {
  const c = activeContactEditor.contact;
  if (!c) return;
  // Remove assignments to this contact
  Object.keys(state.assignments).forEach(taskId => {
    if (state.assignments[taskId] === c.id) delete state.assignments[taskId];
  });
  state.customContacts = state.customContacts.filter(cc => cc.id !== c.id);
  saveState();
  queueOp({ type: 'deleteContact', contactId: c.id });
  showToast(`Șters: ${c.name}`);
  closeContactEditor();
  // Re-render everything since assignments may have changed across many tasks
  render();
}

function rerenderContactsSection() {
  // Find the contacts card and replace it
  const oldEl = document.querySelector('.contacts-card');
  if (oldEl) {
    const contactsBlock = DATA.find(b => b.isContacts);
    if (contactsBlock) {
      const newEl = renderContacts(contactsBlock);
      oldEl.replaceWith(newEl);
    }
  }
}

// Contact modal event handlers
document.getElementById('contactCancel').addEventListener('click', closeContactEditor);
document.getElementById('contactSave').addEventListener('click', saveContactFromEditor);
document.getElementById('contactModal').addEventListener('click', (e) => {

});

document.getElementById('contactDeleteBtn').addEventListener('click', () => {

// Category picker click
document.getElementById('categoryPicker').addEventListener('click', (e) => {

// Allow Enter to save in contact form
['contactName', 'contactRole', 'contactPhone', 'contactNewCategory'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();

  });

  });

// ============ FILTER ============
function applyFilter() {
  const filter = state.filter;
  document.querySelectorAll('.task').forEach(taskEl => {
    const id = taskEl.dataset.taskId;
    const done = !!state.done[id];
    const assigned = state.assignments[id];
    let show = true;
    if (filter === 'open') show = !done;
    else if (filter === 'done') show = done;
    else if (filter === 'unassigned') show = !assigned;
    else if (filter === 'me') show = assigned === 'me';
    taskEl.classList.toggle('hidden', !show);
  });

  document.querySelectorAll('.zone').forEach(zoneEl => {
    const visible = zoneEl.querySelectorAll('.task:not(.hidden)').length;
    zoneEl.classList.toggle('hidden', visible === 0);
  });

  document.querySelectorAll('.block-section').forEach(blockEl => {
    if (blockEl.querySelector('.contacts-header')) {
      // Hide contacts card when filtering
      blockEl.classList.toggle('hidden', filter !== 'all');
      return;
    }
    const visible = blockEl.querySelectorAll('.task:not(.hidden)').length;
    blockEl.classList.toggle('hidden', visible === 0);
  });
}

// ============ ASSIGN MODAL ============
function openAssignModal(taskId) {
  activeAssignTaskId = taskId;
  activeAssignSearch = '';
  const task = findTask(taskId);
  document.getElementById('assignTaskText').textContent = task ? task.text : '';
  document.getElementById('assignSearch').value = '';
  renderAssignOptions();
  document.getElementById('assignModal').classList.add('visible');
  setTimeout(() => document.getElementById('assignSearch').focus(), 200);
}

function closeAssignModal() {
  document.getElementById('assignModal').classList.remove('visible');
  activeAssignTaskId = null;
}

function renderAssignOptions() {
  const container = document.getElementById('assignOptions');
  const search = activeAssignSearch.toLowerCase().trim();
  const currentAssign = activeAssignTaskId ? state.assignments[activeAssignTaskId] : null;
  const allContacts = getAllContacts();

  let html = '';

  // Add new contact option (always at top)
  html += `
    <div class="assign-option add-new" data-pick-contact="__new__">
      <div class="assign-option-icon add-new-icon">+</div>
      <div class="assign-option-info">
        <div class="assign-option-name">Adaugă contact nou${search ? ' „' + activeAssignSearch + '"' : ''}</div>
        <div class="assign-option-meta">Creează și asignează</div>
      </div>
    </div>
  `;

  // Unassign option (only if currently assigned)
  if (currentAssign) {
    html += `
      <div class="assign-option" data-pick-contact="__unassign__">
        <div class="assign-option-icon unassign">−</div>
        <div class="assign-option-info">
          <div class="assign-option-name">Elimină asignare</div>
        </div>
      </div>
    `;
  }

  // Me option
  const meContact = allContacts.find(c => c.id === 'me');
  if (!search || meContact.name.toLowerCase().includes(search)) {
    const selectedClass = currentAssign === 'me' ? 'selected' : '';
    html += `
      <div class="assign-option ${selectedClass}" data-pick-contact="me">
        <div class="assign-option-icon me">EU</div>
        <div class="assign-option-info">
          <div class="assign-option-name">${meContact.name}</div>
          <div class="assign-option-meta">Eu mă ocup</div>
        </div>
      </div>
    `;
  }

  // Group others by category
  const grouped = {};
  allContacts.forEach(c => {
    if (c.special === 'me') return;
    const haystack = `${c.name} ${c.role || ''}`.toLowerCase();
    if (search && !haystack.includes(search)) return;
    if (!grouped[c.category]) grouped[c.category] = [];
    grouped[c.category].push(c);
  });

  Object.keys(grouped).forEach(cat => {
    html += `<div style="font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); padding:0.75rem 0.5rem 0.25rem; font-weight:600">${cat}</div>`;
    grouped[cat].forEach(c => {
      const selectedClass = currentAssign === c.id ? 'selected' : '';
      const initials = c.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const sub = c.role || (c.phone ? c.phone : '');
      const isCustom = c.id.startsWith('custom-') ? ' <span class="custom-badge-sm">custom</span>' : '';
      html += `
        <div class="assign-option ${selectedClass}" data-pick-contact="${c.id}">
          <div class="assign-option-icon">${initials}</div>
          <div class="assign-option-info">
            <div class="assign-option-name">${c.name}${isCustom}</div>
            <div class="assign-option-meta">${sub}</div>
          </div>
        </div>
      `;
    });
  });

  container.innerHTML = html;
}

// ============ EVENT HANDLERS ============
document.addEventListener('click', (e) => {
  // Assign chip click
  const assignTaskId = e.target.closest('[data-assign-task]');
  if (assignTaskId) {
    openAssignModal(assignTaskId.dataset.assignTask);
    e.stopPropagation();
    return;
  }

  // Pick contact in modal
  const pickContact = e.target.closest('[data-pick-contact]');
  if (pickContact && activeAssignTaskId) {
    const contactId = pickContact.dataset.pickContact;
    if (contactId === '__new__') {
      // Open new-contact modal, pre-fill with search if any
      const prefillName = activeAssignSearch.trim();
      const taskIdToAssign = activeAssignTaskId;
      openContactEditor(null, prefillName, (newContact) => {
        // After save: assign new contact to active task
        state.assignments[taskIdToAssign] = newContact.id;
        showToast(`Adăugat și asignat: ${newContact.name}`);
        updateTaskAssignment(taskIdToAssign);
        updateMyTasksFab();
        saveState();
        queueOp({ type: 'setAssign', taskId: taskIdToAssign, contactId: newContact.id });
        if (state.filter !== 'all') applyFilter();
        // Re-render contacts section if visible
        rerenderContactsSection();
        closeAssignModal();
      });
      return;
    }
    if (contactId === '__unassign__') {
      delete state.assignments[activeAssignTaskId];
      queueOp({ type: 'setAssign', taskId: activeAssignTaskId, contactId: null });
      showToast('Asignare eliminată');
    } else {
      state.assignments[activeAssignTaskId] = contactId;
      const contact = getContact(contactId);
      queueOp({ type: 'setAssign', taskId: activeAssignTaskId, contactId: contactId });
      showToast(contact ? `Asignat: ${contact.name}` : 'Asignat');
    }
    updateTaskAssignment(activeAssignTaskId);
    updateMyTasksFab();
    saveState();
    if (state.filter !== 'all') applyFilter();
    closeAssignModal();
    return;
  }

  // Add contact button (from contacts section)
  if (e.target.id === 'addContactBtn') {
    openContactEditor(null, '', (newContact) => {
      showToast(`Adăugat: ${newContact.name}`);
      rerenderContactsSection();
    });
    return;
  }

  // Edit contact (custom only)
  const editContact = e.target.closest('[data-edit-contact]');
  if (editContact) {
    const id = editContact.dataset.editContact;
    const c = state.customContacts.find(cc => cc.id === id);
    if (c) {
      openContactEditor(c, '', () => {
        rerenderContactsSection();
        // Update any tasks displaying this contact
        Object.keys(state.assignments).forEach(taskId => {
          if (state.assignments[taskId] === id) updateTaskAssignment(taskId);
        });
      });
    }
    return;
  }

  // Toggle task
  const toggleId = e.target.dataset.toggleTask;
  if (toggleId) {
    state.done[toggleId] = !state.done[toggleId];
    const taskEl = document.querySelector(`[data-task-id="${toggleId}"]`);
    if (taskEl) taskEl.classList.toggle('done', state.done[toggleId]);
    const blockId = findBlockForTask(toggleId);
    if (blockId) updateBlockProgress(blockId);
    updateGlobalProgress();
    updateMyTasksFab();
    saveState();
    queueOp({ type: 'toggleDone', taskId: toggleId, value: !!state.done[toggleId] });
    if (state.filter !== 'all') applyFilter();
    return;
  }

  // Toggle block
  const blockToggle = e.target.closest('[data-block-toggle]');
  if (blockToggle) {
    const id = blockToggle.dataset.blockToggle;
    state.collapsed[id] = !state.collapsed[id];
    const header = blockToggle;
    const body = header.nextElementSibling;
    if (header.classList.contains('contacts-header')) {
      header.querySelector('.chevron').style.transform = state.collapsed[id] ? 'rotate(-90deg)' : '';
      body.classList.toggle('collapsed', state.collapsed[id]);
    } else {
      header.classList.toggle('collapsed', state.collapsed[id]);
      body.classList.toggle('collapsed', state.collapsed[id]);
    }
    saveState();
    return;
  }

  // Note button
  const noteBtnId = e.target.dataset.noteBtn;
  if (noteBtnId) {
    const noteEl = document.querySelector(`[data-note-for="${noteBtnId}"]`);
    if (noteEl) {
      noteEl.classList.toggle('visible');
      if (noteEl.classList.contains('visible')) {
        const ta = noteEl.querySelector('textarea');
        if (ta) setTimeout(() => ta.focus(), 100);
      }
    }
    return;
  }

  // Filter pills
  if (e.target.classList.contains('pill')) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    state.filter = e.target.dataset.filter;
    saveState();
    applyFilter();
  }
});

// Assign search
document.getElementById('assignSearch').addEventListener('input', (e) => {
  activeAssignSearch = e.target.value;
  renderAssignOptions();
});

// Close assign modal on backdrop click
document.getElementById('assignModal').addEventListener('click', (e) => {
  if (e.target.id === 'assignModal') closeAssignModal();
});

// Note input (per-task debounce ca să nu trimitem la fiecare tastă)
const noteDebounce = {};
document.addEventListener('input', (e) => {
  const noteId = e.target.dataset.noteInput;
  if (noteId) {
    const val = e.target.value;
    if (val) state.notes[noteId] = val;
    else delete state.notes[noteId];
    const btn = document.querySelector(`[data-note-btn="${noteId}"]`);
    if (btn) btn.classList.toggle('has-note', val.length > 0);
    saveState();

    // Per-note debounce: send 1s after user stops typing
    if (noteDebounce[noteId]) clearTimeout(noteDebounce[noteId]);
    noteDebounce[noteId] = setTimeout(() => {
      queueOp({ type: 'setNote', taskId: noteId, value: val });
      delete noteDebounce[noteId];
    }, 1000);
  }
});

// FAB: filter to "me"
document.getElementById('myTasksFab').addEventListener('click', () => {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-filter="me"]').classList.add('active');
  state.filter = 'me';
  saveState();
  applyFilter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ============ CONFIRM MODAL ============
function showConfirm(title, text, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmModal').classList.add('visible');
  const confirm = document.getElementById('confirmOk');
  const newConfirm = confirm.cloneNode(true);
  confirm.parentNode.replaceChild(newConfirm, confirm);
  newConfirm.addEventListener('click', () => {
    onConfirm();
    document.getElementById('confirmModal').classList.remove('visible');
  });
}

document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('visible');
});

document.getElementById('confirmModal').addEventListener('click', (e) => {
  if (e.target.id === 'confirmModal') document.getElementById('confirmModal').classList.remove('visible');
});

// ============ RESET ============
document.getElementById('resetBtn').addEventListener('click', () => {
  showConfirm(
    'Resetează vederea locală?',
    'Această acțiune afectează DOAR acest dispozitiv: ce blocuri sunt deschise, filtrul activ, numele tău. Datele echipei (bife, asignări, contacte) nu se șterg. Pentru a șterge tot pentru toată echipa, ține apăsat 2 secunde pe butonul Reset.',
    () => {
      state.collapsed = {};
      state.filter = 'all';
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      const allPill = document.querySelector('[data-filter="all"]');
      if (allPill) allPill.classList.add('active');
      localStorage.removeItem('merakiActor');
      sync.actor = getActorName();
      saveState();
      render();
      updateSyncBadge();
      showToast('Vedere locală resetată');
    }
  );
});

// Long-press reset → global wipe
let resetPressTimer = null;
const resetBtnEl = document.getElementById('resetBtn');
resetBtnEl.addEventListener('pointerdown', () => {
  resetPressTimer = setTimeout(() => {
    resetPressTimer = null;
    showConfirm(
      '⚠️ Reset COMPLET pentru toată echipa?',
      'Vei șterge TOATE bifele, asignările, notele și contactele adăugate, pentru toți cei care folosesc acest checklist. Acțiunea NU poate fi anulată. Continuă doar dacă ești absolut sigur.',
      async () => {
        // Build ops to clear server state
        const ops = [];
        Object.keys(state.done).forEach(taskId => ops.push({ type: 'toggleDone', taskId, value: false }));
        Object.keys(state.notes).forEach(taskId => ops.push({ type: 'setNote', taskId, value: '' }));
        Object.keys(state.assignments).forEach(taskId => {
          // Don't clear default assignments — but we don't track that here, so we clear all
          ops.push({ type: 'setAssign', taskId, contactId: null });
        });
        state.customContacts.forEach(c => ops.push({ type: 'deleteContact', contactId: c.id }));

        // Send in one batch
        try {
          await fetch(API_BASE + '/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ actor: sync.actor + ' (RESET TOTAL)', ops })
          });
          // Re-fetch and re-render
          const fresh = await fetchInitialState();
          if (fresh) reconcileFromServer(fresh);
          showToast('Resetat complet pentru toată echipa');
        } catch (e) {
          showToast('Eroare la reset — verifică conexiunea');
        }
      }
    );
  }, 2000);
});

['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
  resetBtnEl.addEventListener(ev, () => {
    if (resetPressTimer) { clearTimeout(resetPressTimer); resetPressTimer = null; }
  });
});

// ============ EXPORT ============
document.getElementById('exportBtn').addEventListener('click', () => {
  let txt = `MERAKI LAGO RESORT & SPA\nCHECKLIST ȘANTIER — ${new Date().toLocaleDateString('ro-RO')}\n`;
  txt += '═'.repeat(50) + '\n\n';

  const gs = getGlobalStats();
  txt += `PROGRES GENERAL: ${gs.done}/${gs.total} (${gs.percent}%)\n\n`;

  DATA.forEach(block => {
    if (!block.zones) return;
    const bs = getBlockStats(block);
    txt += `\n${block.title.toUpperCase()} — ${bs.done}/${bs.total} (${bs.percent}%)\n`;
    txt += '─'.repeat(40) + '\n';
    block.zones.forEach(zone => {
      txt += `\n  ${zone.title}${zone.sub ? ' — ' + zone.sub.replace(/&amp;/g, '&') : ''}\n`;
      zone.tasks.forEach(task => {
        const mark = state.done[task.id] ? '[x]' : '[ ]';
        const assignId = state.assignments[task.id];
        const contact = assignId ? getContact(assignId) : null;
        const assign = contact ? `  ⟶ ${contact.name}${contact.role ? ' (' + contact.role + ')' : ''}${contact.phone ? ' · ' + contact.phone : ''}` : '';
        const urg = task.urgent ? ' ⚠' : '';
        txt += `  ${mark} ${task.text}${assign}${urg}\n`;
        if (state.notes[task.id]) txt += `      notă: ${state.notes[task.id]}\n`;
      });
    });
    txt += '\n';
  });

  // Contacts at end
  txt += `\nCONTACTE\n` + '═'.repeat(50) + '\n';
  const groupedC = {};
  getAllContacts().forEach(c => {
    if (c.special === 'me') return;
    if (!groupedC[c.category]) groupedC[c.category] = [];
    groupedC[c.category].push(c);
  });
  Object.keys(groupedC).forEach(cat => {
    txt += `\n  ${cat}\n`;
    groupedC[cat].forEach(c => {
      const role = c.role ? ` – ${c.role}` : '';
      const phone = c.phone ? ` · ${c.phone}` : '';
      txt += `    ${c.name}${role}${phone}\n`;
    });
  });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `checklist_meraki_lago_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export descărcat');
});

// ============ TOAST ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 1800);
}

// Sync badge: click → schimbă numele afișat
document.getElementById('syncBadge').addEventListener('click', () => {
  const current = sync.actor || '';
  const newName = prompt('Numele tău (apare în istoric pentru ceilalți):', current);
  if (newName !== null) {
    setActorName(newName);
  }
});

// ============ INIT ============
async function init() {
  // Set actor first (will prompt if missing)
  sync.actor = getActorName();

  // Try to fetch from server first
  const serverState = await fetchInitialState();

  if (serverState) {
    // Server has data → use it as source of truth
    state.done = serverState.done || {};
    state.notes = serverState.notes || {};
    state.assignments = serverState.assignments || {};
    state.customContacts = serverState.customContacts || [];
    state.customCategories = serverState.customCategories || [];
    // Local-only fields: collapsed, filter — load from localStorage
    try {
      const localRaw = localStorage.getItem(STORAGE_KEY);
      if (localRaw) {
        const localState = JSON.parse(localRaw);
        state.collapsed = localState.collapsed || {};
        state.filter = localState.filter || 'all';
      }
    } catch (e) {}
    // Apply default assignments where none set
    DATA.forEach(block => {
      if (block.zones) {
        block.zones.forEach(zone => {
          zone.tasks.forEach(task => {
            if (task.defaultAssign && !(task.id in state.assignments)) {
              state.assignments[task.id] = task.defaultAssign;
            }
          });
        });
      }
    });
    saveState(); // cache locally
  } else {
    // Offline fallback: load from localStorage
    loadState();
    showToast('Offline — folosesc copie locală');
  }

  render();
  updateSyncBadge();
  startSyncPolling();

  // Flush any leftover ops from offline use
  if (state.__pendingOps && state.__pendingOps.length > 0) {
    sync.pendingOps = state.__pendingOps;
    delete state.__pendingOps;
    scheduleFlush();
  }
}

init();
